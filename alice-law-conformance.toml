# ALICE-Law conformance manifest for this crate (alice-sdf). One entry per
# gate defined in ALICE-Law's conformance/gates.toml. Fields (status /
# evidence / mutant / since / note / reference_repo) and the four statuses
# (pass / fail-known / unverified / n/a) are docs/CONFORMANCE.md's "Manifest"
# section in that repository.
#
# Each entry is written from what this repository's own files, CI workflows
# and tests show at the commit that adds or edits it. `pass` needs the
# evidence and a mutant that turns it red. `fail-known` names a violation
# that is known, with its location. Where no violation is known but the
# machine check the gate requires is missing or incomplete, or a scan has no
# canary, the entry is `unverified` with what is missing.

