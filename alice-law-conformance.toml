[G10]
status = "fail-known"
evidence = [
    "clippy.toml (disallowed-methods bans std::time::Instant::now / ::elapsed, std::time::SystemTime::now / ::elapsed and std::collections::hash_map::RandomState::new; disallowed-types bans std::collections::hash_map::RandomState, which also covers RandomState::default)",
