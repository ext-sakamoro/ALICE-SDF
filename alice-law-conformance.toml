    ".github/workflows/ci.yml clippy job: Clippy strict (no-default-features), Clippy strict (default, all targets), Clippy strict (all features that build on Linux, all targets), Clippy (library code ...), all with -D warnings",
    "scripts/clippy-lib-canary/src/lib.rs clock_instant / clock_system / instant_elapsed / system_time_elapsed / random_state, checked by scripts/clippy_lib_gate.py in the same job",
    "scripts/test_clippy_lib_gate.py (test_clippy_toml_bans_elapsed, the canary line tests)",
]
mutant = "planting Instant::now().elapsed(), a held Instant's .elapsed(), SystemTime::now().elapsed(), a method reference Instant::elapsed, an `Instant as I` alias's .elapsed(), Instant::now(), SystemTime::now(), RandomState::new() or HashMap::<_, _, RandomState>::default() in src turns the library clippy run (CLIPPY_CONF_DIR=.github/clippy-lib, the CI feature set, -D warnings) red (rc 101, the matching disallowed method or type) while a.duration_since(b) stays green (rc 0); Instant::now().elapsed() in src also turns `cargo clippy --all-targets` red (rc 101); removing the std::time::Instant::elapsed entry from clippy.toml and regenerating makes scripts/clippy_lib_gate.py exit 1 (canary line `i.elapsed()` has no disallowed-method diagnostic); measured 2026-10-15, restored"
note = "fail-known: a located violation sits behind the pub API. alice_sdf::cache_bridge::SdfEvalCache (src/cache_bridge.rs:47, feature sdf-cache, which the CI feature set builds) wraps alice_cache::AliceCache (constructed at src/cache_bridge.rs:59), and alice-cache 0.2.0 seeds its hasher with ahash::RandomState::new() (alice-cache src/cache.rs:196 in the published crate), which reads OS entropy through getrandom. Which entries survive eviction therefore differs between identical runs (measured: capacity 512, 4000 puts, 3 identical runs, a different surviving-key set each run), and because keys are quantised cells, a hit can return another point's value from the same cell, so the output of a cached evaluation depends on the run. Neither clippy nor a source scan of this repository sees it: the read is inside a dependency and the type is ahash's RandomState, not std's; getrandom arrives transitively through ahash. No output of SDF itself varies today: nothing in src/ outside src/cache_bridge.rs constructs or calls SdfEvalCache (src/lib.rs:154 only declares the module); the users are examples/sdf_eval_cache.rs and tests/test_sdf_eval_cache_oracle.rs, and the variation reaches a caller that evaluates through the cache once a shard is full (below capacity only the shard placement differs). The root fix is a deterministic hasher seed in alice-cache: its main branch replaces ahash::RandomState::new() with a fixed-seed hasher (DEFAULT_SEED, with_seed / with_config_and_seed) and pins the result by digest, unreleased, for alice-cache 0.3.0. This entry moves to pass when SDF requires alice-cache 0.3 with SdfEvalCache::new on the default seed and adds a determinism test (the same operation sequence over capacity gives the same surviving set and hit values, by digest, on every CI OS); no git or path dependency is used meanwhile. The rest of the gate is in place: library code (src outside src/bin) has 0 clock, entropy or UUID reads: a scan finds none of SystemTime::now, Instant::now, .elapsed(), UNIX_EPOCH, thread_rng, OsRng, getrandom, RandomState, Uuid, from_entropy, js_sys Math::random or Date::now, and the crate has no direct rand / uuid / getrandom / fastrand dependency (getrandom is reached transitively, through ahash in alice-cache as above and through the jit toolchain's hashers; whether the latter can change generated code is not verified). The CLI (src/bin/main.rs), examples/bake_assets, examples/gpu_eval and tests/test_degenerate_input_oracle.rs read the clock only to print a timing or bound a test's run time; each such call carries its own #[allow(clippy::disallowed_methods)] with that reason, and none of those durations reaches an output byte Scope: the gate covers the library (Law-bearing output). Outside it, 81 example / test / bench targets carry a crate-level #![allow(clippy::disallowed_methods)] for their libm oracles and scene values, which would also hide a clock read added there later; their current clock sites all have a per-site allow with a reason, and narrowing those crate-level allows is a separate item."
reference_repo = "ALICE-Analytics"

