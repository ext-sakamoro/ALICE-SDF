[package]
name = "alice-sdf-fuzz"
license = "LicenseRef-Proprietary"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata.alice]
surfaces = []

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
# fuzz target で使う: primitive coord = glam::Vec3、serialize = alice-serial の bincode1 (bincode 1 layout)
glam = "0.29"
alice-serial = { git = "https://github.com/ext-sakamoro/ALICE-Serial", branch = "main", version = "0.2", default-features = false, features = ["serde"] }

[dependencies.alice-sdf]
path = ".."

# Prevent cargo-machete false-positive detection (fuzz は本体 dep 除外)
[package.metadata.cargo-machete]
ignored = ["libfuzzer-sys"]

[[bin]]
name = "fuzz_sdf_eval"
path = "fuzz_targets/fuzz_sdf_eval.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_asdf_decode"
path = "fuzz_targets/fuzz_asdf_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_bincode_roundtrip"
path = "fuzz_targets/fuzz_bincode_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_eval_parity"
path = "fuzz_targets/fuzz_eval_parity.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_askc_read"
path = "fuzz_targets/fuzz_askc_read.rs"
test = false
doc = false
bench = false
