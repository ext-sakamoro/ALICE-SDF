# scripts/api_boundary.py (ALICE-Law G7): every boundary item with its decision
features = "aaa,all-shaders,asp,blinkscript,cli,codec,destruction,ffi,font,gi,glsl,godot,gpu,gpu-mesh,hlsl,image,jit,msl,openvdb,physics,python,rust,sdf-cache,svo,svo-gpu,terrain,texture-fit,unity,unreal,volume"
bindings = ["pyo3"]
targets = [{ target = "wasm32-unknown-unknown", features = "wasm" }]
# compiled only on one OS (rustdoc documents the host it runs on): checked there, skipped elsewhere
# with a PREFLIGHT-SKIP line. CI runs the check on Linux (clippy job), macOS and Windows
# (api-boundary-os job), so an item compiled only on one of them is enumerated there
host = { "abi::godot::__cxa_thread_atexit_impl" = "linux" }

# The parsers of outside bytes or text: a `local` entry that reaches one of them through the call
# graph fails (scripts/api_boundary_parsers.py). This list is the parsers outside serde and bincode,
# in SCIP form `<crate> <descriptor>` without the version; the serde_json / bincode / serde readers
# are taken from the library clippy configuration's stored-form set (.github/clippy-lib/clippy.toml),
# so the two cannot drift. [parser_exempt] and [parser_unindexed] are at the end of this file.
parsers = [
  "naga front/wgsl/parse_str().",
  "naga front/glsl/impl#[Frontend]parse().",
  "wgpu api/device/impl#[Device]create_shader_module().",
  "image images/dynimage/load_from_memory().",
  "image images/dynimage/open().",
  "alice-codec rans/impl#[`RansDecoder<'a>`]decode_n().",
  "libasp packet/impl#[AspPacket]from_bytes().",
]
# the crates of the list above: each of their parse-like functions this crate calls must be in
# `parsers` or in [parser_not_parser] (so the list cannot miss a parser a later change calls)
parser_crates = ["naga", "wgpu", "image", "alice-codec", "libasp", "vdb-rs"]

