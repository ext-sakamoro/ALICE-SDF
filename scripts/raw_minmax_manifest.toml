# The library files that may call the raw max / min helpers (src/raw_minmax.rs),
# with how many uses each has. Checked by scripts/raw_minmax_manifest.py:
# a use outside this list, a different count, an entry with no use, or a use
# outside [scope] raw-allowed fails. A count may go down freely; raising it needs a
# `why` that names the new use.
#
#   [allowed."src/path/file.rs"]
#   uses = 3
#   why = "colour weights, never a distance, bound, mesh or stored byte"

# Default-deny: a raw helper may be used only in a file under one of these
# prefixes (rendering only); every other library file uses the Law helpers.
[scope]
raw-allowed = ["src/npr/"]

[allowed."src/npr/compiled_color.rs"]
uses = 22
why = "NPR shading: a colour or shading weight, never a distance, bound, mesh or stored byte; also the uses under the rendering helpers' libm allows"

