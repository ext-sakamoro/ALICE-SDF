# Every iteration of a HashMap / HashSet in src/ and why its order (unspecified:
# random hasher seed, std version) cannot reach an output (ALICE-Law G13).
# Checked both ways by scripts/hash_order_audit.py. An iteration whose order
# would reach an output does not get an entry: it is fixed (an ordered
# collection or a sort).

[[site]]
file = "src/cache/chunked.rs"
code = "for entry in chunks.entries.values_mut() {"
verdict = "not-observed"
why = "invalidate_all sets every entry's dirty flag; the order of the assignments is not observable"

