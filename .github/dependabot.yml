# Dependabot 設定
#
# 初回 wave で溜まった全更新が一気に PR 化されるのを防ぐため
# semver-major bump は ignore する 必要時は手動で PR 化判断
#
# 注: root Cargo.toml の cargo entry は意図的に削除
# 理由: root は ../ALICE-Codec / ../ALICE-Physics / ../ALICE-Streaming-Protocol /
#       ../ALICE-Cache / ../ALICE-Font の sibling path dep を持ち、dependabot は
#       sibling repo を checkout しないため path_dependencies_not_reachable で fail する
#       root 直接の cargo dep update は手動 `cargo update -p <name>` で対応
#
# 対象 (残った):
# - cargo (mobile/uniffi-wrapper)  ※ path=../.. は同 repo 内なので OK
# - cargo (server)                ※ path=..    は同 repo 内なので OK
# - cargo (bindings/bevy/alice-sdf-bevy)  ※ path=../../.. は同 repo 内なので OK
# - github-actions (workflow 内 action)
# - npm (bindings/threejs)

version: 2
updates:
  - package-ecosystem: cargo
    directory: /mobile/uniffi-wrapper
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /bindings/bevy/alice-sdf-bevy
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    # `dtolnay/rust-toolchain@<Rust 版>` の tag は action の version ではなく
    # 「その Rust 版を入れろ」という選択子で、`Cargo.toml` の `rust-version` と対で動く
    # upstream は各 Rust 版を branch として持つので dependabot が version と誤認して
    # 「最新」へ書き換える (実測 1.87 -> 1.120) `update-types` の major ignore では
    # 止まらない (dependabot の目には minor bump に見える)
    # 実在しない版に書き換われば rustup が 404 で落ち、実在する版なら CI は green の
    # まま MSRV 検証だけが無効化される (後者は error 文字列が出ないので検出できない)
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /bindings/threejs
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
