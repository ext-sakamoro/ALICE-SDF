# Text files are LF in the index and in every OS's checkout (scripts/check_eol.py, shared by the ALICE
# crates). Shared files are compared byte for byte with ALICE-Law's table, and a CRLF checkout on
# Windows would differ from it; the Windows leg is the one that would see it.
name: Line endings

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  eol:
    name: Line endings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Line endings (tests, then check)
        shell: bash
        run: |
          python scripts/test_check_eol.py
          python scripts/check_eol.py
