name: Bake assets

# Builds render meshes (GPU marching cubes on lavapipe, CPU marching cubes on
# the same grid, glTF / .abm / .nanite) and the physics data (the SDF tree,
# its compiled bytecode, tight AABB, volume, centre of mass and inertia
# tensor) for a few representative scenes with examples/bake_assets, verifies
# every written file from disk, checks that each corruption in
# scripts/bake_teeth.sh makes the verification fail, and keeps the output as
# a workflow artifact (90 days for a v* tag, 14 days otherwise).
#
# Changed paths are compared with the last commit on main whose Bake assets
# run succeeded, not with the previous push: `on.push.paths` compares with
# the previous push, so the changes of a run cancelled by a newer push were
# never baked (the same gap ci.yml closed in its `changes` job). Tags and
# manual runs always bake.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "5"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      bake: ${{ steps.base.outputs.full == 'true' || steps.filter.outputs.bake == 'true' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # push: compare with the last successful bake on main (a cancelled or
      # red run's changes are then compared again by the next push); no such
      # commit (first run, rewritten history, API failure) bakes everything
      - name: Change detection base (last successful bake on main)
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            workflow_dispatch:*|push:refs/tags/*)
              echo "full=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
            push:*) ;;
            *) exit 0 ;;
          esac
          sha=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow bake.yml --branch main --event push --status success --limit 1 --json headSha --jq '.[0].headSha // ""' 2>/dev/null || true)
          if [ -n "$sha" ] && git cat-file -e "${sha}^{commit}" 2>/dev/null; then
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            echo "change detection base: $sha (last successful bake on main)"
          else
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "::warning::last successful bake commit unavailable (got '$sha'): baking"
          fi
      - uses: dorny/paths-filter@v4
        id: filter
        if: steps.base.outputs.full != 'true'
        with:
          base: ${{ steps.base.outputs.sha }}
          filters: |
            bake:
              - 'src/**'
              - 'examples/bake_assets/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'scripts/bake_teeth.sh'
              - '.github/workflows/bake.yml'

  bake:
    name: Bake and verify (lavapipe)
    needs: changes
    if: needs.changes.outputs.bake == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # "no adapter" is a failure here, not a skipped GPU mesh
      ALICE_SDF_REQUIRE_GPU: "1"
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # same as ci.yml's gpu-parity job
      - name: Install Mesa software Vulkan (lavapipe)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools
          icd=$(find /usr/share/vulkan/icd.d -name "lvp_icd*.json" | head -1)
          echo "lavapipe ICD: $icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$icd" vulkaninfo --summary | tee /tmp/vulkaninfo.txt | head -60
          grep -qi llvmpipe /tmp/vulkaninfo.txt

      - name: Build examples/bake_assets
        run: cargo build --example bake_assets --features gpu-mesh

      - name: Bake and verify
        run: |
          set -euo pipefail
          cargo run -q --example bake_assets --features gpu-mesh -- bake bake-out 2>&1 | tee bake.log
          # the verify summary must report scenes and checks, with the GPU mesh present
          grep -E '^verified [1-9][0-9]* scenes, [1-9][0-9]* checks passed, 0 failed$' bake.log
          if grep -q '^SKIPPED: GPU mesh' bake.log; then echo "GPU mesh skipped on lavapipe"; exit 1; fi
          grep -q '"status": "ok"' bake-out/manifest.json

      - name: Corrupted outputs must fail verification
        run: scripts/bake_teeth.sh bake-out gpu-mesh

      - name: Summary
        if: always()
        run: |
          {
            echo "### Bake output"
            echo
            echo '```'
            grep -E '^(  |scene |verified |baked )' bake.log || true
            echo '```'
            echo
            echo '```'
            (cd bake-out && find . -type f -exec ls -l {} + | awk '{print $5, $9}' | sort -k2) || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bake-${{ github.sha }}
          path: bake-out
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 90 || 14 }}
