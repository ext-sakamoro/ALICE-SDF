# The "ALICE-Law integration" block of README.md and README_JP.md is generated by ALICE-Law's
# scripts/gen-law-readme-block.py from the ALICE-Law revision named in the block and this
# repository's alice-law-conformance.toml and Cargo.toml. This job regenerates it at that revision,
# with the generator of that revision, and fails when either README differs or has no block.
# A newer ALICE-Law does not make the block stale here; regenerating it is part of the next
# integration (`gen-law-readme-block.py write --law-ref <revision> ...`).
name: ALICE-Law README block

on:
  # no paths filter: a new branch at an existing commit would skip the run, and the job takes seconds
  push:
    branches: [main, "ci/**"]
  workflow_dispatch:

permissions:
  contents: read

# a superseded run on a branch is cancelled; on main each commit keeps its own run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: README block matches ALICE-Law
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - name: ALICE-Law at the pinned revision
        run: |
          pin=$(grep -oE 'law-integration:begin law=[0-9a-f]{40}' README.md | head -n 1 | cut -d= -f2)
          test -n "$pin" || { echo "README.md has no law-integration block"; exit 1; }
          git clone --quiet --filter=blob:none https://github.com/ext-sakamoro/ALICE-Law.git "$RUNNER_TEMP/law"
          git -C "$RUNNER_TEMP/law" cat-file -e "${pin}^{commit}"
          git -C "$RUNNER_TEMP/law" show "${pin}:scripts/gen-law-readme-block.py" > "$RUNNER_TEMP/gen-law-readme-block.py"
      - name: Check the block
        run: |
          python3 --version
          python3 "$RUNNER_TEMP/gen-law-readme-block.py" check --law "$RUNNER_TEMP/law" --crate alice-sdf \
            --crate-repo . --law-main origin/main --lint warn
