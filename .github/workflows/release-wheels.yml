name: Build Python wheels (release)

# tag push (v*) で発火。Linux x86_64 / Linux aarch64 / macOS arm64 / macOS x86_64 /
# Windows x86_64 の wheel を maturin で abi3-py310 ビルドし、対応する GitHub Release に
# 添付する。abi3 のため Python 3.10 / 3.11 / 3.12 / 3.13 が 1 wheel でカバーされる。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-wheels:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            wheel-name: linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            wheel-name: linux-aarch64
          - os: macos-14
            target: aarch64-apple-darwin
            wheel-name: macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            wheel-name: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            wheel-name: windows-x86_64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target
        shell: bash
        run: rustup target add ${{ matrix.target }}

      # the build machine's paths are remapped so the wheel does not carry them (RUSTFLAGS
      # reaches the manylinux container too); audit-wheels checks the wheels
      - name: Remap build paths
        shell: bash
        run: echo "RUSTFLAGS=$(scripts/release_remap_flags.sh)" >> "$GITHUB_ENV"

      - name: Build wheel (manylinux)
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu'
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --features python --interpreter 3.12
          manylinux: auto
          rust-toolchain: stable
      - name: Build wheel (macOS / Windows)
        if: matrix.os != 'ubuntu-latest'
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --features python --interpreter 3.12
          rust-toolchain: stable

      - name: List built wheels
        shell: bash
        run: ls -lh dist/

      # the wheel itself is installed and exercised, not only built; the aarch64
      # Linux wheel is cross-built on an x86_64 runner and cannot run there
      - name: Install the wheel and run the smoke test
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          python -m pip install numpy dist/*.whl
          python python/tests/smoke.py

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.wheel-name }}
          path: dist/*.whl
          if-no-files-found: error

  # no home path, private name, internal word or token-like string in the wheels (on a
  # tag and on a manual run alike)
  audit-wheels:
    name: Release artifact audit (wheels)
    needs: build-wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          path: wheels/
          pattern: wheels-*
          merge-multiple: true

      - name: Release artifact audit
        run: python3 scripts/release_artifact_audit.py wheels/

  attach-to-release:
    name: Attach wheels to GitHub Release
    needs: [build-wheels, audit-wheels]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          path: wheels/
          pattern: wheels-*
          merge-multiple: true

      - name: List wheels
        shell: bash
        run: ls -lh wheels/

      - name: Attach wheels to release
        uses: softprops/action-gh-release@v3
        with:
          files: wheels/*.whl
          fail_on_unmatched_files: true
