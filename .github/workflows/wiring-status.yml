name: Wiring Status

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**/*.rs'
      - 'scripts/wiring_guard.py'
      - 'scripts/wiring-baseline.txt'
      - 'scripts/gen-wiring-status.py'

permissions:
  contents: write

# wiring-status と oracle-status は同じ push で起動して同じ main へ push する
# 1 つの group に直列化する (2026-10-03 実測: 並走すると遅い方が必ず
# `! [rejected] main -> main (fetch first)` で落ち、`|| true` に隠されて台帳が古いまま残った)
# cancel-in-progress は false: 走行中の run は最後まで走らせ、待ちは最新の 1 本だけ残る
concurrency:
  group: status-docs-main
  cancel-in-progress: false

jobs:
  generate-wiring-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Generate and publish wiring status
        run: |
          git config user.name "wiring-bot"
          git config user.email "noreply@github.com"
          # 台帳は main の先端の状態の写し: push する直前の先端で生成し直し、先に他の push が
          # 入っていたら (non-fast-forward) 取り直してもう一度生成する  rebase で古い版を載せない
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout --detach --force origin/main
            python3 scripts/gen-wiring-status.py
            if git diff --quiet docs/wiring-status.md; then
              echo "docs/wiring-status.md is already up to date"
              exit 0
            fi
            git add docs/wiring-status.md
            git commit -m "docs: update wiring status [automated]"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "::error::docs/wiring-status.md を main へ push できなかった (5 回): 台帳が古いまま残る"
          exit 1
