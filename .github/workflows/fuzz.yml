name: Fuzz

# 目的:
# - SDF eval / asdf decode / bincode roundtrip / eval parity (tree vs compiled vs SIMD) の 4 target を time-boxed fuzz
# - PR / push 毎に短時間 (30-60s/target) 実行、long-run は別途 batch fuzzing infra 想定
#
# 罠 catalog:
# - cargo-fuzz は nightly toolchain 必須 (rust-toolchain.toml pin と別)
# - libfuzzer-sys は AddressSanitizer 前提 → linker flags 自動注入
# - fuzz/ 配下は cargo workspace の一部ではない (別 Cargo.toml)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'fuzz/**'
      - '.github/workflows/fuzz.yml'
      - '.github/actions/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'fuzz/**'
      - '.github/workflows/fuzz.yml'
      - '.github/actions/**'
  schedule:
    # 毎日 03:00 UTC = 12:00 JST (idle 時間帯)
    # 長時間 batch fuzzing の 1 段目、PR 検知漏れの safety net
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'Per-target fuzz duration (seconds)'
        required: false
        default: '60'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz — ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_sdf_eval
          - fuzz_asdf_decode
          - fuzz_bincode_roundtrip
          - fuzz_eval_parity
    steps:
      - uses: actions/checkout@v5

      # cargo-fuzz は nightly toolchain 必須 (rust-toolchain.toml 1.92.0 pin を上書き)
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # build は blocking: compile error を continue-on-error で隠さない
      # (canonical 罠 #22、2026-09-14 ALICE-Bamboo 12 日間 silent fail 事案)
      - name: Build fuzz target
        run: |
          cd fuzz
          cargo +nightly fuzz build "${{ matrix.target }}"

      # duration: workflow_dispatch input or default 60s
      - name: Set fuzz duration
        id: dur
        run: |
          DURATION="${{ github.event.inputs.duration_seconds }}"
          if [ -z "$DURATION" ]; then
            DURATION=60
          fi
          echo "seconds=$DURATION" >> "$GITHUB_OUTPUT"

      # Every crash a target ever found is committed under fuzz/seeds/<target>/;
      # replaying those single inputs is a hard gate (a regression of a known
      # finding fails the job). libFuzzer runs file arguments once and exits.
      - name: Replay committed seeds (blocking)
        run: |
          cd fuzz
          # paths are relative to fuzz/ (the crate dir cargo-fuzz runs in)
          seeds="seeds/${{ matrix.target }}"
          if [ -d "$seeds" ] && [ -n "$(ls -A "$seeds")" ]; then
            for f in "$seeds"/*; do
              echo "replay: $f"
              cargo +nightly fuzz run "${{ matrix.target }}" "$f"
            done
          else
            echo "no committed seeds for ${{ matrix.target }}"
          fi

      # The time-boxed exploration run is informational by design (not a
      # test gate): a *new* crash uploads its input as an artifact for triage
      # and, once committed to fuzz/seeds/, becomes part of the blocking
      # replay above.
      - name: Run fuzz target (time-boxed)
        id: run
        continue-on-error: true
        run: |
          cd fuzz
          # sanitizer=address (default)、-max_total_time でタイムボックス
          # seeds/<target>/ = committed regression inputs (also fed as a corpus
          # dir here); corpus/<target>/ is the working set. Paths are relative
          # to fuzz/ — until 1.12.0 they were spelled "fuzz/seeds/…" from inside
          # fuzz/, so the seed branch never ran in CI.
          seeds="seeds/${{ matrix.target }}"
          if [ -d "$seeds" ]; then
            cargo +nightly fuzz run "${{ matrix.target }}" "corpus/${{ matrix.target }}" "$seeds" -- \
              -max_total_time=${{ steps.dur.outputs.seconds }}
          else
            cargo +nightly fuzz run "${{ matrix.target }}" -- \
              -max_total_time=${{ steps.dur.outputs.seconds }}
          fi

      # crash 検出時のみ artifact upload (通常 pass では skip)
      - name: Upload crash artifacts (if any)
        if: steps.run.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 14

      - name: Report crash (informational)
        if: steps.run.outcome == 'failure'
        run: echo "::warning::fuzz target ${{ matrix.target }} found a crash — see fuzz-crash-${{ matrix.target }} artifact"
