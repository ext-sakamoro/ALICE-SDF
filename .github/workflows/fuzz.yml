name: Fuzz

# 目的:
# - SDF eval / asdf decode / bincode roundtrip / eval parity (tree vs compiled vs SIMD) の 4 target を time-boxed fuzz
# - PR / push 毎に短時間 (30-60s/target) 実行、long-run は別途 batch fuzzing infra 想定
#
# 注意点:
# - cargo-fuzz は nightly toolchain 必須 (rust-toolchain.toml pin と別)
# - libfuzzer-sys は AddressSanitizer 前提 → linker flags 自動注入
# - fuzz/ 配下は cargo workspace の一部ではない (別 Cargo.toml)
# - build、committed seeds の replay、time-boxed run はすべて blocking (continue-on-error
#   は使わない) run は crash でも 0 runs でも red (scripts/fuzz_runs.py が log を読む)

on:
  push:
    # ci/** runs the gate before a land (max 2 targets at a time off main)
    branches: [main, 'ci/**']
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'fuzz/**'
      - 'scripts/fuzz_runs.py'
      - 'scripts/test_fuzz_runs.py'
      - '.github/workflows/fuzz.yml'
      - '.github/actions/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'fuzz/**'
      - 'scripts/fuzz_runs.py'
      - 'scripts/test_fuzz_runs.py'
      - '.github/workflows/fuzz.yml'
      - '.github/actions/**'
  schedule:
    # 毎日 03:00 UTC = 12:00 JST (idle 時間帯)
    # 長時間 batch fuzzing の 1 段目、PR 検知漏れの safety net
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'Per-target fuzz duration (seconds)'
        required: false
        default: '60'
        type: string

permissions:
  contents: read

# on main each commit has a group of its own (a group keeps one pending run and
# would cancel an older pending one whatever cancel-in-progress says), and a
# newer push cancels an older run only off main: main and the scheduled run
# finish, so their result is a verdict and not "cancelled"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz — ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: ${{ github.ref == 'refs/heads/main' && 4 || 2 }}
      matrix:
        target:
          - fuzz_sdf_eval
          - fuzz_asdf_decode
          - fuzz_bincode_roundtrip
          - fuzz_eval_parity
    steps:
      - uses: actions/checkout@v5

      # cargo-fuzz は nightly toolchain 必須 (rust-toolchain.toml 1.92.0 pin を上書き)
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Test the run-count reader
        run: python3 scripts/test_fuzz_runs.py

      # build は blocking: compile error を continue-on-error で隠さない
      # (別 repo で fuzz の build が 12 日間 silent に失敗していた例がある)
      - name: Build fuzz target
        run: |
          cd fuzz
          cargo +nightly fuzz build "${{ matrix.target }}"

      # duration: workflow_dispatch input or default 60s
      - name: Set fuzz duration
        id: dur
        run: |
          DURATION="${{ github.event.inputs.duration_seconds }}"
          if [ -z "$DURATION" ]; then
            DURATION=60
          fi
          echo "seconds=$DURATION" >> "$GITHUB_OUTPUT"

      # Every crash a target ever found is committed under fuzz/seeds/<target>/;
      # replaying those single inputs is a hard gate (a regression of a known
      # finding fails the job). libFuzzer runs file arguments once and exits.
      - name: Replay committed seeds (blocking)
        run: |
          cd fuzz
          # paths are relative to fuzz/ (the crate dir cargo-fuzz runs in)
          seeds="seeds/${{ matrix.target }}"
          if [ -d "$seeds" ] && [ -n "$(ls -A "$seeds")" ]; then
            for f in "$seeds"/*; do
              echo "replay: $f"
              cargo +nightly fuzz run "${{ matrix.target }}" "$f"
            done
          else
            echo "no committed seeds for ${{ matrix.target }}"
          fi

      # The time-boxed run is a gate: a crash, or a run that executed no
      # input, fails the job. The log is kept so that the next step can read
      # the run count; a crash input is uploaded for triage and, once fixed,
      # committed to fuzz/seeds/ so that the blocking replay above keeps it.
      # seeds/<target>/ = committed regression inputs (also fed as a corpus
      # dir here); corpus/<target>/ is the working set. Paths are relative to
      # fuzz/ (sanitizer=address, the default).
      - name: Run fuzz target (time-boxed)
        id: run
        shell: bash
        run: |
          set -o pipefail
          cd fuzz
          mkdir -p "corpus/${{ matrix.target }}"
          dirs=("corpus/${{ matrix.target }}")
          [ -d "seeds/${{ matrix.target }}" ] && dirs+=("seeds/${{ matrix.target }}")
          cargo +nightly fuzz run "${{ matrix.target }}" "${dirs[@]}" -- \
            -max_total_time=${{ steps.dur.outputs.seconds }} 2>&1 | tee "$RUNNER_TEMP/fuzz.log"

      # Read the run count from the log: a crash, or a run that executed
      # nothing, is red (runs / seconds / result per target in the summary)
      - name: Check the runs (crash or 0 runs = fail)
        if: always() && steps.run.outcome != 'skipped'
        shell: bash
        run: |
          {
            echo "| target | runs | seconds | result |"
            echo "|---|---|---|---|"
            python3 scripts/fuzz_runs.py "${{ matrix.target }}" "$RUNNER_TEMP/fuzz.log"
          } >> "$GITHUB_STEP_SUMMARY"

      # crash 検出時のみ artifact upload (通常 pass では skip)
      - name: Upload crash artifacts (if any)
        if: failure() && steps.run.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 14

      - name: Report crash
        if: failure() && steps.run.outcome == 'failure'
        run: echo "::error::fuzz target ${{ matrix.target }} found a crash — see fuzz-crash-${{ matrix.target }} artifact"
