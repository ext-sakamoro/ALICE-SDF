name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            lib_name: libalice_sdf.dylib
            platform: macOS
            lib_dir: Mac
          - os: macos-15
            target: x86_64-apple-darwin
            lib_name: libalice_sdf.dylib
            platform: macOS-Intel
            lib_dir: Mac
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            lib_name: alice_sdf.dll
            platform: Win64
            lib_dir: Win64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            lib_name: libalice_sdf.so
            platform: Linux
            lib_dir: Linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      # rust-toolchain.toml pins the toolchain; installing `stable` here left the
      # pinned toolchain without the cross target (macOS-Intel: "can't find crate
      # for core", every Release since v1.7.3). Let rustup honour the pin, then
      # add the matrix target to that toolchain.
      - name: Install pinned toolchain + target
        shell: bash
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      - name: Create dependency stubs
        shell: bash
        run: |
          mkdir -p ../ALICE-Physics/src
          cat > ../ALICE-Physics/Cargo.toml << 'TOML'
          [package]
          name = "alice-physics"
          version = "0.1.0"
          edition = "2021"
          [lib]
          path = "src/lib.rs"
          TOML
          echo "" > ../ALICE-Physics/src/lib.rs

          mkdir -p ../ALICE-Codec/src
          cat > ../ALICE-Codec/Cargo.toml << 'TOML'
          [package]
          name = "alice-codec"
          version = "0.1.0"
          edition = "2021"
          [lib]
          path = "src/lib.rs"
          TOML
          echo "" > ../ALICE-Codec/src/lib.rs

          mkdir -p ../ALICE-Streaming-Protocol/src
          cat > ../ALICE-Streaming-Protocol/Cargo.toml << 'TOML'
          [package]
          name = "libasp"
          version = "0.1.0"
          edition = "2021"
          [lib]
          path = "src/lib.rs"
          TOML
          echo "" > ../ALICE-Streaming-Protocol/src/lib.rs

          mkdir -p ../ALICE-Cache/src
          cat > ../ALICE-Cache/Cargo.toml << 'TOML'
          [package]
          name = "alice-cache"
          version = "0.1.0"
          edition = "2021"
          [lib]
          path = "src/lib.rs"
          TOML
          echo "" > ../ALICE-Cache/src/lib.rs

          mkdir -p ../ALICE-Font/src
          cat > ../ALICE-Font/Cargo.toml << 'TOML'
          [package]
          name = "alice-font"
          version = "0.1.0"
          edition = "2021"
          [lib]
          path = "src/lib.rs"
          TOML
          echo "" > ../ALICE-Font/src/lib.rs

      # `unreal` = ffi + hlsl + glsl + gpu: the plugin calls alice_sdf_to_wgsl
      # (GenerateWgsl) too, and a narrower set makes every user's build fail in
      # the linker (3.2.0).
      - name: Build release library
        run: cargo build --release --features unreal --target ${{ matrix.target }}

      # ── UE5 Plugin ──
      - name: Package UE5 plugin
        shell: bash
        run: |
          PLUGIN_DIR="AliceSDF"
          mkdir -p "$PLUGIN_DIR/ThirdParty/AliceSDF/lib/${{ matrix.lib_dir }}"
          mkdir -p "$PLUGIN_DIR/ThirdParty/AliceSDF/include"

          # Copy plugin sources. Shaders/ and Config/ are not optional: the
          # module maps /Plugin/AliceSDF to Shaders/ at startup, and
          # Config/FilterPlugin.ini is what keeps ThirdParty/ in a UAT-packaged
          # plugin. Both were missing from this zip until 3.2.0.
          cp unreal-plugin/AliceSDF.uplugin "$PLUGIN_DIR/"
          cp -r unreal-plugin/Source "$PLUGIN_DIR/"
          cp -r unreal-plugin/Shaders "$PLUGIN_DIR/"
          cp -r unreal-plugin/Config "$PLUGIN_DIR/"
          cp -r unreal-plugin/Resources "$PLUGIN_DIR/" 2>/dev/null || true
          cp unreal-plugin/README.md "$PLUGIN_DIR/"

          # Copy header and built library
          cp include/alice_sdf.h "$PLUGIN_DIR/ThirdParty/AliceSDF/include/"
          cp "target/${{ matrix.target }}/release/${{ matrix.lib_name }}" \
             "$PLUGIN_DIR/ThirdParty/AliceSDF/lib/${{ matrix.lib_dir }}/"
          # Windows links against the import library; without it the plugin does
          # not build in the user's project at all.
          if [ "${{ matrix.platform }}" = "Win64" ]; then
            cp "target/${{ matrix.target }}/release/alice_sdf.dll.lib" \
               "$PLUGIN_DIR/ThirdParty/AliceSDF/lib/Win64/alice_sdf.lib"
          fi

          # What the zip must contain for "drop it in Plugins/ and open the
          # project" to work.
          for f in AliceSDF.uplugin Source Shaders Config \
                   ThirdParty/AliceSDF/include/alice_sdf.h \
                   "ThirdParty/AliceSDF/lib/${{ matrix.lib_dir }}/${{ matrix.lib_name }}"; do
            [ -e "$PLUGIN_DIR/$f" ] || { echo "missing from the UE5 zip: $f"; exit 1; }
          done

      - name: Create UE5 ZIP
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "Win64" ]; then
            7z a "AliceSDF-UE5-Plugin-${{ matrix.platform }}.zip" AliceSDF/
          else
            zip -r "AliceSDF-UE5-Plugin-${{ matrix.platform }}.zip" AliceSDF/
          fi

      # ── Unity Plugin ──
      - name: Package Unity plugin
        shell: bash
        run: |
          UNITY_DIR="AliceSDF-Unity"
          mkdir -p "$UNITY_DIR/Plugins/${{ matrix.lib_dir }}"

          # C# bindings
          cp bindings/AliceSdf.cs "$UNITY_DIR/"

          # C header (for advanced users)
          cp include/alice_sdf.h "$UNITY_DIR/"

          # Native library
          cp "target/${{ matrix.target }}/release/${{ matrix.lib_name }}" \
             "$UNITY_DIR/Plugins/${{ matrix.lib_dir }}/"

      - name: Create Unity ZIP
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "Win64" ]; then
            7z a "AliceSDF-Unity-Plugin-${{ matrix.platform }}.zip" AliceSDF-Unity/
          else
            zip -r "AliceSDF-Unity-Plugin-${{ matrix.platform }}.zip" AliceSDF-Unity/
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: plugin-${{ matrix.platform }}
          path: |
            AliceSDF-UE5-Plugin-${{ matrix.platform }}.zip
            AliceSDF-Unity-Plugin-${{ matrix.platform }}.zip

  # ── VRChat Package (pure C#, platform-independent) ──
  vrchat:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Package VRChat
        run: |
          cd vrchat-package
          zip -r ../AliceSDF-VRChat-Package.zip \
            package.json \
            README.md \
            README_JP.md \
            CHANGELOG.md \
            Runtime/ \
            Editor/ \
            Samples~/ \
            Prefabs~/ \
            -x "*.meta" "Library/*" "Logs/*" "UserSettings/*" "ProjectSettings/*" "Packages/*" "Assets/*"

      - uses: actions/upload-artifact@v6
        with:
          name: vrchat-package
          path: AliceSDF-VRChat-Package.zip

  release:
    needs: [build, vrchat]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true

      - name: List release assets
        run: ls -la -- *.zip

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            AliceSDF-UE5-Plugin-*.zip
            AliceSDF-Unity-Plugin-*.zip
            AliceSDF-VRChat-Package.zip
          generate_release_notes: true
