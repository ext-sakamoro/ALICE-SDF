name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 連続 push で前の run を即 cancel (runner minutes 浪費防止)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 一過性 HTTP/2 framing layer 失敗対策 (本番 2026-06-06 Windows runner 実害)
  CARGO_NET_RETRY: "5"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  # docs / mobile-only な PR でフル CI を回さないための paths-filter
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      mobile: ${{ steps.filter.outputs.mobile }}
      python: ${{ steps.filter.outputs.python }}
      ci: ${{ steps.filter.outputs.ci }}
      vrchat: ${{ steps.filter.outputs.vrchat }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'benches/**'
              - 'examples/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
            mobile:
              - 'mobile/**'
            python:
              - 'python/**'
              - 'pyproject.toml'
            ci:
              - '.github/**'
            vrchat:
              - 'vrchat-package/**'
              - 'examples/vrchat_*'
              - 'scripts/vrchat-host-parity.sh'

  test:
    name: Test — ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.ci == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (ARM64)
          - os: ubuntu-latest
            name: Linux (x86_64)
          - os: windows-latest
            name: Windows (x86_64)
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # 主要ビルド (retry あり、本番 HTTP/2 errror 耐性)
      - name: Build (default)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: cargo build --lib

      - name: Test (core)
        run: cargo test --lib

      # Hard gate since 1.11.0: this used to be continue-on-error, which
      # made the transpiler unit tests a dead gate (external review 2026-09-15).
      - name: Test (shader transpilers + texture-fit lib tests)
        run: cargo test --lib --features "glsl,hlsl,gpu,texture-fit"

      - name: Test (integration)
        run: cargo test --tests

      # feature-gated integration oracles (svo: tests/test_svo_query_oracle.rs)
      - name: Test (integration, feature-gated oracles — svo / texture-fit)
        run: cargo test --features "svo,texture-fit" --test test_svo_query_oracle --test test_texture_fit_oracle

      # doctest (= rustdoc 内 ```rust ブロック) は --lib / --tests では走らない
      # feedback_ci_errors_patterns B3: ``` 文字リテラル混入で doctest 落ちる罠予防
      - name: Test (doctests)
        run: cargo test --doc

      - name: Build (FFI + shaders)
        run: cargo build --features "ffi,hlsl,glsl"

      - name: Build (no default features) [T0]
        run: cargo build --lib --no-default-features

      - name: Build (JIT) [T3]
        run: cargo build --lib --no-default-features --features "jit"

      # Bridges resolve to crates.io siblings since 1.12.0 — hard gate
      # (this step was continue-on-error against non-existent features).
      - name: Build + test (bridges physics / codec / asp / sdf-cache) [T3]
        run: cargo test --lib --no-default-features --features "physics,codec,asp,sdf-cache"

      # unity / unreal = ffi + shader: every extern "C" fn is panic-isolated
      # (ffi_guard), so these are hard gates (continue-on-error removed 1.11.0)
      - name: Build (Unity meta) [T2]
        run: cargo build --lib --no-default-features --features "unity"

      - name: Build (Unreal meta) [T2]
        run: cargo build --lib --no-default-features --features "unreal"

      # Hard gate since 1.12.0 (was continue-on-error; it hid scene_composer
      # tests that built GLSL / HLSL without those transpilers enabled).
      - name: Test (AAA meta) [T4]
        run: cargo test --lib --no-default-features --features "aaa"

      - name: Benchmark compilation check
        run: cargo bench --no-run

  wasm:
    name: WebAssembly (wasm32) cross-compile
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # rust-toolchain.toml (= channel 1.92.0 pin) があると dtolnay action の
      # targets: パラメータが stable に追加されるだけで、active toolchain 1.92.0 に
      # は反映されない E0463 can't find crate for `core` 回避のため明示追加
      - name: Ensure wasm32 target on pinned toolchain
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build (wasm feature, wasm32 target)
        run: cargo build --lib --no-default-features --features wasm --target wasm32-unknown-unknown
      - name: Test wasm (host, lib-only)
        run: cargo build --lib --no-default-features --features wasm

  openvdb:
    name: OpenVDB I/O
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (openvdb feature)
        run: cargo build --lib --no-default-features --features openvdb
      - name: Test (openvdb feature)
        run: cargo test --lib --no-default-features --features openvdb vdb

  bevy:
    name: Bevy plugin (bindings/bevy/alice-sdf-bevy)
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/bevy/alice-sdf-bevy
      - name: Install bevy build deps (Linux)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: Build (lib)
        working-directory: bindings/bevy/alice-sdf-bevy
        run: cargo build --lib
      - name: Test (lib)
        working-directory: bindings/bevy/alice-sdf-bevy
        run: cargo test --lib

  bridges:
    name: Bridges (each feature alone, no stubs)
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Every bridge on its own (a feature must not depend on another one
      # being enabled) with the real crates.io deps — no alice-stubs action.
      - name: physics
        run: cargo test --lib --no-default-features --features "physics"
      - name: codec
        run: cargo test --lib --no-default-features --features "codec"
      - name: asp
        run: cargo test --lib --no-default-features --features "asp"
      - name: sdf-cache
        run: cargo test --lib --no-default-features --features "sdf-cache"
      - name: clippy (all bridges, -D warnings)
        run: cargo clippy --lib --features "physics,codec,asp,sdf-cache" -- -D warnings

  mobile:
    name: Mobile — iOS / Android cross-compile
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || needs.changes.outputs.code == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            mobile/uniffi-wrapper

      - name: Add mobile rustup targets
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk

      - name: Install Android NDK (cached by setup-java)
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Build host (lib + uniffi-bindgen binary)
        working-directory: mobile/uniffi-wrapper
        run: cargo build --release

      - name: Build iOS aarch64 (device)
        working-directory: mobile/uniffi-wrapper
        run: cargo build --release --target aarch64-apple-ios

      - name: Build iOS aarch64 (sim)
        working-directory: mobile/uniffi-wrapper
        run: cargo build --release --target aarch64-apple-ios-sim

      - name: Build iOS x86_64 (sim, Intel Mac)
        working-directory: mobile/uniffi-wrapper
        run: cargo build --release --target x86_64-apple-ios

      - name: Build iOS aarch64 with gpu (Metal backend)
        working-directory: mobile/uniffi-wrapper
        run: cargo build --release --target aarch64-apple-ios --features gpu

      - name: Build Android 4 ABIs
        working-directory: mobile/uniffi-wrapper
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo ndk \
            -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 \
            build --lib --release

      - name: Verify Swift bindings generate clean
        working-directory: mobile/uniffi-wrapper
        run: |
          cargo run --release --bin uniffi-bindgen -- \
            generate src/alice_sdf.udl \
            --language swift \
            --out-dir /tmp/ci-swift

      - name: Verify Kotlin bindings generate clean
        working-directory: mobile/uniffi-wrapper
        run: |
          cargo run --release --bin uniffi-bindgen -- \
            generate src/alice_sdf.udl \
            --language kotlin \
            --out-dir /tmp/ci-kotlin

      # Integration tests over the 12 publicly-exported wrapper functions.
      # Release プロファイルは `panic = "abort"` のため integration test の
      # 動的 unwind との互換が取れない → debug プロファイルで実行する。
      - name: Run integration tests (debug)
        working-directory: mobile/uniffi-wrapper
        run: cargo test --tests

  clippy:
    name: Clippy (core strict, -D warnings)
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # core src/** は strict (-D warnings)。v1.7.2 で informational から格上げ。
      # 新しい clippy lint (Rust リリース毎に追加される) が混入したら CI で即発覚させる。
      - name: Clippy strict (no-default-features)
        run: cargo clippy --lib --no-default-features
        env:
          RUSTFLAGS: "-Dwarnings"

      # --all-targets: tests / benches / examples も lint 対象 (template 罠 #26)
      - name: Clippy strict (default, all targets)
        run: cargo clippy --all-targets
        env:
          RUSTFLAGS: "-Dwarnings"

      # Every feature-gated module is linted (the crate-wide pedantic /
      # nursery policy in Cargo.toml applies to whatever is compiled): the
      # docs.rs set + AAA + bridges + openvdb.
      - name: Clippy strict (all features that build on Linux, all targets)
        run: cargo clippy --all-targets --features "glsl,hlsl,gpu,jit,svo,terrain,destruction,gi,ffi,volume,gpu-mesh,svo-gpu,openvdb,physics,codec,asp,sdf-cache,texture-fit"
        env:
          RUSTFLAGS: "-Dwarnings"

      # examples/gpu_eval.rs は required-features = ["gpu"] なので default CI では
      # compile されない (1.9.2 まで API drift で壊れたまま気付かなかった)
      - name: Build feature-gated examples (gpu / glsl / hlsl)
        run: cargo build --examples --features "glsl,hlsl,gpu"
        env:
          RUSTFLAGS: "-Dwarnings"

  clippy-strict:
    name: Clippy strict (mobile wrapper, includes alice-sdf path dep)
    needs: changes
    # mobile/uniffi-wrapper は alice-sdf core を path dep として再 clippy する。
    # core (src/**) 変更時にも厳格化を効かせるため code もトリガに含める。
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.mobile == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile/uniffi-wrapper

      # 新規 mobile/ クレートは厳格 (-D warnings)
      - name: Clippy strict (mobile/uniffi-wrapper)
        working-directory: mobile/uniffi-wrapper
        env:
          RUSTFLAGS: "-Dwarnings"
        run: cargo clippy --lib --all-targets

  fmt:
    name: Format
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.mobile == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting (core)
        run: cargo fmt --check

      - name: Check formatting (mobile/uniffi-wrapper)
        working-directory: mobile/uniffi-wrapper
        run: cargo fmt --check

  msrv:
    name: MSRV (rust-version = 1.85)
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Cargo.toml `rust-version` を実証する (canonical template 罠 #27)。
      # 宣言値と同じ toolchain を pin し、default feature + docs.rs feature set
      # で `cargo check` が通ることを確認する。宣言を上げる時はここも上げる。
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2

      - name: Check (default features)
        run: cargo check --lib

      - name: Check (docs.rs feature set)
        run: cargo check --lib --features "glsl,hlsl,jit,svo,terrain,destruction,gi,ffi"

  # The transpilers' only correctness oracle runs the generated WGSL on a real
  # wgpu device (tests/test_gpu_law_parity.rs etc.). GitHub runners have no
  # GPU, so this job installs Mesa's software Vulkan driver (lavapipe) and
  # requires an adapter (ALICE_SDF_REQUIRE_GPU=1 turns "no adapter → skip"
  # into a failure). Until 1.11.0 these tests had never run in CI
  # (external review 2026-09-15, SDF-3 / SDF-R2-7).
  gpu-parity:
    name: GPU parity (lavapipe)
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    env:
      ALICE_SDF_REQUIRE_GPU: "1"
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The lavapipe ICD file name depends on the Mesa build
      # (`lvp_icd.x86_64.json` up to 24.x, `lvp_icd.json` from 25.x on
      # noble-updates): locate it instead of hard-coding, and prove the loader
      # sees llvmpipe before spending a build on the tests.
      - name: Install Mesa software Vulkan (lavapipe)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools
          icd=$(find /usr/share/vulkan/icd.d -name "lvp_icd*.json" | head -1)
          echo "lavapipe ICD: $icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$icd" vulkaninfo --summary | tee /tmp/vulkaninfo.txt | head -60
          grep -qi llvmpipe /tmp/vulkaninfo.txt

      - name: GPU ↔ CPU law parity, shader validation, GPU marching cubes
        run: >
          cargo test --features "gpu,glsl,gpu-mesh,texture-fit"
          --test test_gpu_law_parity
          --test test_gpu_noise_parity
          --test test_round_tie_parity
          --test test_transpiler_naga_validate
          --test noise_shader_validate
          --test test_mesh_orientation
          --test test_texture_shader_gpu_parity
          -- --nocapture

  doc:
    name: Doc (RUSTDOCFLAGS=-Dwarnings)
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # karikari-review 推奨: rustdoc warning (broken link / missing example 等) を CI で deny
      - name: cargo doc (core, no-deps)
        run: cargo doc --lib --no-deps
        env:
          RUSTDOCFLAGS: "-Dwarnings"

      # docs.rs builds with this feature set (+ texture-fit, whose intra-doc
      # links to private SIMD items were only visible with the feature on).
      - name: cargo doc (docs.rs feature set + texture-fit)
        run: cargo doc --lib --no-deps --features "glsl,hlsl,jit,svo,terrain,destruction,gi,ffi,texture-fit"
        env:
          RUSTDOCFLAGS: "-Dwarnings"

  vrchat-host:
    name: VRChat host parity (C# collider vs alice_sdf golden)
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.vrchat == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # SampleMochi_Collider.cs は UdonSharp 向けで Unity でしか compile されない
      # → UnityEngine stub 相手に C# 7.3 -warnaserror で compile し、EvaluateSdf を
      # examples/vrchat_mochi_golden.rs (alice_sdf::eval) と 1521 点突合 + grab /
      # split / merge シナリオ (vrchat-package/HostTests~/README.md)
      - name: Mochi parity + behaviour
        run: scripts/vrchat-host-parity.sh

  actionlint:
    name: actionlint (workflow YAML 検証)
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # feedback_workflow_yaml_pitfall: `run:` 末尾 `::` で 0 秒 failure 等の罠を予防
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check

  server-smoke:
    name: REST server smoke test
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Build server
        working-directory: server
        run: cargo build --release

      - name: Start server in background
        working-directory: server
        run: |
          ./target/release/alice-sdf-server &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> "$GITHUB_ENV"
          sleep 2

      - name: Smoke /version
        run: |
          curl -fsS http://localhost:8787/version | grep -q "alice-sdf-server"

      - name: Smoke /eval (sphere)
        run: |
          RESULT=$(curl -fsS -X POST http://localhost:8787/eval \
            -H 'Content-Type: application/json' \
            -d '{"shape":"sphere","point":[2.0,0,0],"params":{"radius":1.0}}')
          echo "Response: $RESULT"
          echo "$RESULT" | grep -q '"distance":1'

      - name: Smoke /op (smooth_union)
        run: |
          RESULT=$(curl -fsS -X POST http://localhost:8787/op \
            -H 'Content-Type: application/json' \
            -d '{"op":"smooth_union","a":0.3,"b":-0.2,"k":0.1}')
          echo "Response: $RESULT"
          echo "$RESULT" | grep -q '"distance"'

      - name: Smoke /mesh (sphere, res=16)
        run: |
          RESULT=$(curl -fsS -X POST http://localhost:8787/mesh \
            -H 'Content-Type: application/json' \
            -d '{"shape":"sphere","params":{"radius":1.0},"resolution":16}')
          echo "$RESULT" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['vertex_count']>100, d"

      - name: Smoke /splat (sphere, res=12)
        run: |
          RESULT=$(curl -fsS -X POST http://localhost:8787/splat \
            -H 'Content-Type: application/json' \
            -d '{"shape":"sphere","params":{"radius":0.5},"resolution":12}')
          echo "$RESULT" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['splat_count']>0, d"

      - name: Smoke /vox (sphere, size=12)
        run: |
          RESULT=$(curl -fsS -X POST http://localhost:8787/vox \
            -H 'Content-Type: application/json' \
            -d '{"shape":"sphere","params":{"radius":0.5},"size":12}')
          echo "$RESULT" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['voxel_count']>0 and d['size']==[12,12,12], d"

      - name: Stop server
        if: always()
        run: |
          if [ -n "${SERVER_PID:-}" ]; then
            kill "$SERVER_PID" 2>/dev/null || true
          fi

  # The PyO3 binding had no CI coverage (release-wheels only builds it).
  # Builds the extension with maturin and runs python/tests/smoke.py, whose
  # every assertion has a closed-form answer (unit sphere / box distances,
  # eval_batch == |p| - 1, compiled == tree, mesh vertices on the sphere with
  # outward winding and volume within 5 % of 4/3 pi, asdf / json round trips).
  python-smoke:
    name: Python binding smoke (maturin develop + analytic oracle)
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.python == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build and install the binding into a venv
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --quiet maturin numpy
          maturin develop --features python

      - name: Run the analytic smoke test
        run: |
          . .venv/bin/activate
          python python/tests/smoke.py

  wasm-build:
    name: WASM bindings build
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # rust-toolchain.toml pin (1.92.0) と action の targets 不整合回避
      - name: Ensure wasm32 target on pinned toolchain
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Build wasm
        run: cargo build --release --target wasm32-unknown-unknown --features wasm --no-default-features

      - name: Verify wasm artifact exists
        run: |
          test -f target/wasm32-unknown-unknown/release/alice_sdf.wasm
          ls -lh target/wasm32-unknown-unknown/release/alice_sdf.wasm

  threejs-typecheck:
    name: Three.js TypeScript type-check
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install deps
        working-directory: bindings/threejs
        run: |
          if [ -f package.json ]; then
            npm install --no-fund --no-audit
          else
            echo "::warning::no package.json — skipping"
            exit 0
          fi

      - name: TypeScript build
        working-directory: bindings/threejs
        run: |
          if [ -f tsconfig.json ]; then
            npx tsc --noEmit
          fi

  mobile-sample-build:
    name: Mobile sample compile (iOS + Android)
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build iOS sample (compile-only via xcodebuild)
        working-directory: mobile/samples/ios-swiftui
        run: |
          if [ -f project.yml ] && command -v xcodegen >/dev/null 2>&1; then
            xcodegen generate
          fi
          XCPROJ=$(find . -maxdepth 1 -name "*.xcodeproj" -print -quit)
          if [ -n "$XCPROJ" ]; then
            SCHEME=$(basename "$XCPROJ" .xcodeproj)
            xcodebuild -project "$XCPROJ" \
              -scheme "$SCHEME" \
              -destination 'generic/platform=iOS Simulator' \
              -configuration Debug \
              build-for-testing \
              CODE_SIGNING_ALLOWED=NO || echo "::warning::iOS sample build failed"
          else
            echo "::warning::no .xcodeproj in mobile/samples/ios-swiftui — skipping"
          fi

      - name: Build Android sample (compile-only via gradle)
        working-directory: mobile/samples/android-compose
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon || echo "::warning::Android sample build skipped (gradlew failed)"
          else
            echo "::warning::no gradlew in mobile/samples/android-compose — skipping"
          fi
