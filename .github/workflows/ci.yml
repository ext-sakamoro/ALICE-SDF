name: CI

on:
  push:
    # ci/**: 取り込み前の branch の CI を main と同じ job で走らせる
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
  # A full run on demand (every job, no path filter): the release gate reads the
  # latest run of this workflow on the publish commit, and a CHANGELOG-only commit
  # would otherwise skip the code jobs, which the gate refuses
  workflow_dispatch:
    inputs:
      full:
        description: "Run every job regardless of the changed paths"
        type: boolean
        default: true

# 連続 push で前の run を即 cancel (runner minutes 浪費防止)
# on main each commit has a group of its own and a run there is never
# cancelled; a newer push cancels an older run only off main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # 一過性 HTTP/2 framing layer 失敗対策 (本番 2026-06-06 Windows runner 実害)
  CARGO_NET_RETRY: "5"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  # docs / mobile-only な PR でフル CI を回さないための paths-filter
  #
  # push の比較元は「直前の push」でなく「main で最後に CI が success した commit」
  # 直前の push を比較元にすると、その run が cancel / red のまま次の push が来た時に
  # 前回分の変更が誰にも test されない (2026-10-04 実測: 同じ tree を再 push した
  # f694d16 は cancel された d3db318 との差分 0 件で全 job が skipped、CI は success)
  # success した run はその比較元からの変更を test 済なので、最後の success を比較元に
  # すれば cancel / red の run の変更は次の push で必ず test される
  # 比較元が取れない (初回 / force-push で履歴から消えた / API 失敗) 時は全 job を走らせる
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      code: ${{ steps.base.outputs.full == 'true' || steps.filter.outputs.code == 'true' }}
      mobile: ${{ steps.base.outputs.full == 'true' || steps.filter.outputs.mobile == 'true' }}
      python: ${{ steps.base.outputs.full == 'true' || steps.filter.outputs.python == 'true' }}
      ci: ${{ steps.base.outputs.full == 'true' || steps.filter.outputs.ci == 'true' }}
      vrchat: ${{ steps.base.outputs.full == 'true' || steps.filter.outputs.vrchat == 'true' }}
      unreal: ${{ steps.base.outputs.full == 'true' || steps.filter.outputs.unreal == 'true' }}
      scip: ${{ steps.base.outputs.full == 'true' || steps.filter.outputs.scip == 'true' }}
      lint: ${{ steps.base.outputs.full == 'true' || steps.filter.outputs.lint == 'true' }}
      boundary: ${{ steps.base.outputs.full == 'true' || steps.filter.outputs.boundary == 'true' }}
      alembic: ${{ steps.base.outputs.full == 'true' || steps.filter.outputs.alembic == 'true' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Change detection base (last successful CI on main)
        id: base
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
        run: |
          if [ "$FULL_INPUT" = "true" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "workflow_dispatch with full=true: running every job"
            exit 0
          fi
          sha=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --status success --limit 1 --json headSha --jq '.[0].headSha // ""' 2>/dev/null || true)
          if [ -n "$sha" ] && git cat-file -e "${sha}^{commit}" 2>/dev/null; then
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            echo "change detection base: $sha (last successful CI on main)"
          else
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "::warning::last successful CI commit unavailable (got '$sha'): running every job"
          fi
      - uses: dorny/paths-filter@v4
        id: filter
        if: steps.base.outputs.full != 'true'
        with:
          base: ${{ steps.base.outputs.sha }}
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'benches/**'
              - 'examples/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
            # the clippy configuration and its gate: a change here must run the clippy job, which
            # runs the canary (scripts/clippy_lib_gate.py); without it a gate or lint change is
            # judged only by the unit tests in the wiring-guard job
            lint:
              - 'clippy.toml'
              - '.github/clippy-lib/**'
              - 'scripts/clippy_lib_gate.py'
              - 'scripts/clippy_lib_gate.toml'
              - 'scripts/test_clippy_lib_gate.py'
              - 'scripts/clippy-lib-canary/**'
            mobile:
              - 'mobile/**'
            python:
              - 'python/**'
              - 'pyproject.toml'
              - 'bindings/nuke/**'
            ci:
              - '.github/**'
            vrchat:
              - 'vrchat-package/**'
              - 'examples/vrchat_*'
              - 'scripts/vrchat-host-parity.sh'
            # the .abc writer and its reader against the Alembic library (alembic-oracle job)
            alembic:
              - 'src/io/alembic.rs'
              - 'src/io/mod.rs'
              - 'src/provenance.rs'
              - 'src/mesh/**'
              - 'tests/test_alembic_oracle.rs'
              - 'tests/oracle/alembic_*'
              - 'tests/oracle/alembic-library.txt'
              - 'scripts/alembic_library_check.py'
              - 'scripts/test_alembic_library_check.py'
              - 'Cargo.toml'
              - 'Cargo.lock'
            unreal:
              - 'unreal-plugin/**'
              - 'include/alice_sdf.h'
              - 'examples/unreal_corpus_oracle.rs'
              - 'examples/support/stored_text.rs'
              - 'scripts/unreal-*'
            # what changes the API boundary rustdoc enumerates (api-boundary-os job)
            boundary:
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'scripts/api_boundary.py'
              - 'scripts/test_api_boundary.py'
              - 'scripts/api_boundary.toml'
              - '.github/workflows/ci.yml'
            scip:
              - 'src/**'
              - 'examples/**'
              - 'benches/**'
              - 'fuzz/**'
              - 'server/src/**'
              - 'server/Cargo.toml'
              - 'mobile/uniffi-wrapper/**'
              - 'bindings/openxr/**'
              - 'Cargo.toml'
              - 'rust-toolchain.toml'
              - 'scripts/scip_index.sh'
              - 'scripts/scip_reach.py'
              - 'scripts/test_scip_reach.py'
              - 'scripts/api_boundary.toml'
              - 'scripts/api_boundary_parsers.py'
              - 'scripts/test_api_boundary_parsers.py'
              - 'scripts/provenance_writers.py'
              - 'scripts/provenance-pending.txt'
              - 'scripts/provenance-not-writers.txt'
              - 'tests/**'
              - 'scripts/integration-baseline.txt'
              - 'scripts/wiring_guard.py'
              - 'scripts/wiring-baseline.txt'
              - 'docs/integration-status.md'

  test:
    name: Test — ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.ci == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (ARM64)
          - os: ubuntu-latest
            name: Linux (x86_64)
          - os: windows-latest
            name: Windows (x86_64)
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # tests/test_metal_library_from_source_only.rs reads `cargo metadata --locked --offline`,
      # which resolves every platform's dependencies, so the cache has to hold all of them, not
      # only what this host builds (a cold cache lacks e.g. the Windows-only anstyle-wincon)
      - name: Fetch every platform's locked crates
        run: cargo fetch --locked

      # The fetch above is what the offline lookup needs: with an empty cargo home the lookup
      # must fail, and after `cargo fetch --locked` it must succeed (Linux lane only, no build)
      - name: Offline metadata needs the fetch (cold cargo home)
        if: runner.os == 'Linux'
        run: |
          export CARGO_HOME="$RUNNER_TEMP/cold-cargo-home"
          mkdir -p "$CARGO_HOME"
          if cargo metadata --format-version 1 --locked --offline > /dev/null 2>&1; then
            echo "::error::offline metadata succeeded with an empty cargo home; this check measures nothing"
            exit 1
          fi
          cargo fetch --locked
          cargo metadata --format-version 1 --locked --offline > /dev/null
          echo "offline metadata: fails cold, passes after fetch"

      # 主要ビルド (retry あり、本番 HTTP/2 errror 耐性)
      - name: Build (default)
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: cargo build --lib

      - name: Test (core)
        run: cargo test --lib

      # Hard gate since 1.11.0: this used to be continue-on-error, which
      # made the transpiler unit tests a dead gate (external review 2026-09-15).
      - name: Test (shader transpilers + texture-fit lib tests)
        run: cargo test --lib --features "glsl,hlsl,gpu,texture-fit"

      # The GPU unit tests on this runner: how many ran and how many skipped (and
      # why), in the log; a runner without a device skips them, the lavapipe job
      # (gpu-parity) requires all six to run
      - name: GPU unit tests (ran / skipped, reported)
        shell: bash
        run: |
          set -euo pipefail
          cargo test --lib --features "gpu,gpu-mesh" test_gpu_ -- --nocapture --test-threads=1 2>&1 | tee gpu-unit.log
          python3 scripts/gpu_test_count.py gpu-unit.log --ran 0

      - name: Test (integration)
        run: cargo test --tests

      # feature-gated integration oracles (svo: tests/test_svo_query_oracle.rs)
      - name: Test (integration, feature-gated oracles — svo / texture-fit)
        run: cargo test --features "svo,texture-fit" --test test_svo_query_oracle --test test_texture_fit_oracle

      # ALICE-Law G8: the whole texts the examples write (shaders and the generated Rust) carry
      # the semantics identifier and their fragments carry none (tests/test_g8_example_text.rs),
      # counted so a feature set that drops the file cannot pass with 0 tests
      - name: Test (the examples' whole text carries the semantics identifier)
        shell: bash
        run: |
          set -euo pipefail
          cargo test --features "msl,glsl,hlsl,blinkscript,rust" --test test_g8_example_text 2>&1 | tee g8-example-text.log
          python3 scripts/libtest_count.py g8-example-text.log --min 5 --what "example text provenance tests"

      # min/max signed-zero Law parity across tree / SIMD / JIT (and SVO bytes).
      # Runs on every matrix OS so the x86_64 and aarch64 legs both assert the
      # one ordered rule (the arch split this guards lives in `f32::max` itself).
      - name: Test (min/max signed-zero Law parity)
        run: cargo test --features "jit,svo" --test test_minmax_signed_zero_probe

      # the svo-gated unit test of src/unordered.rs (min_key_by: the callback sees the keys in
      # key order); no other lib test step builds svo, so without this it never runs. The count
      # check fails when the filter matches fewer than the module's 2 tests (1 of them svo-gated)
      - name: Test (svo-gated lib tests of the unordered map)
        shell: bash
        run: |
          set -euo pipefail
          cargo test --lib --features svo unordered::tests:: 2>&1 | tee unordered-svo.log
          python3 scripts/libtest_count.py unordered-svo.log --min 2 --what "unordered map lib tests (svo)"

      # aaa (volume / gpu-mesh / svo-gpu / destruction / terrain / gi) の解析解 oracle。
      # `*_api_oracle` の 5 file は example から配線した API (chunk の継ぎ目の
      # remesh / DDS header / LRU cache / probe の範囲外など) を固定する。`image` は
      # `Heightmap::from_image*` の arm 用
      # 2026-09-30 まで gi / destruction / terrain / volume は `> 0` / `!is_empty()` の
      # 存在・範囲 check しか持たず、tests/ からは 1 件も呼ばれていなかった。
      # この 2 file で実バグ 6 件 (MC 原点が voxel 角 / vs.x の 3 軸流用 / 左手系 basis /
      # num_cones=0 の u32 underflow / sample の補間重みが clamp 前座標由来 /
      # mip が奇数解像度で footprint の下界でない) を検出している。
      # ⚠️ 1 行で書く (matrix に windows-latest があり既定 shell は pwsh、
      #    バックスラッシュ行継続は ParserError になる)
      - name: Test (integration, analytic oracles — aaa) [T4]
        run: cargo test --features "aaa,image,codec,texture-fit" --test test_gi_volume_oracle --test test_terrain_destruction_oracle --test test_svo_api_oracle --test test_volume_api_oracle --test test_terrain_api_oracle --test test_gi_api_oracle --test test_destruction_api_oracle --test test_provenance
      # the SVO chunk's semantics identifier (tests/test_provenance.rs, *svo_chunk*, gated on svo):
      # counted on their own so a feature set without svo cannot drop them to 0 unnoticed
      # the Nanite HLSL material's semantics identifier (tests/test_provenance.rs,
      # nanite_hlsl_material_*, gated on hlsl): counted on its own for the same reason
      - name: Test (provenance of the Nanite HLSL material — hlsl)
        shell: bash
        run: |
          set -euo pipefail
          cargo test --features hlsl --test test_provenance nanite_hlsl_material 2>&1 | tee provenance-hlsl.log
          python3 scripts/libtest_count.py provenance-hlsl.log --min 1 --what "Nanite HLSL material provenance tests (hlsl)"
      - name: Test (provenance of the SVO chunk — svo)
        shell: bash
        run: |
          set -euo pipefail
          cargo test --features svo --test test_provenance svo_chunk 2>&1 | tee provenance-svo.log
          python3 scripts/libtest_count.py provenance-svo.log --min 3 --what "SVO chunk provenance tests (svo)"

      # file 先頭が `#![cfg(feature = …)]` の oracle は、その feature を付けない
      # `cargo test --tests` では空の binary になり `running 0 tests` で green になる。
      # 2026-10-04 まで下の 2 file (計 28 本) は 3 OS すべてで 0 本実行だった。
      # 繋ぎ忘れは scripts/ci_test_coverage_check.py (wiring-guard job) が red にする。
      - name: Test (integration, physics bridge determinism oracle)
        run: cargo test --features physics --test test_physics_bridge_determinism

      # LiveSdf: one shape for the physics world (collider + participant) and the chunked mesh
      - name: Test (integration, live SDF oracle — physics)
        run: cargo test --features physics --test test_live_sdf_oracle --test test_live_sdf_closed_loop --test test_live_sdf_interrupted

      # With `physics`, alice-physics brings its own alice-det-math: the build must still
      # hold one version (two would be two implementations of every function), and the
      # SIMD-JIT's own range reduction must still match the scalar functions there.
      - name: det-math is one version with physics, and the JIT matches it
        shell: bash
        run: |
          n=$(cargo tree --features "jit,physics" -i alice-det-math -e normal --prefix none | grep -cE '^alice-det-math v')
          echo "alice-det-math versions with jit,physics: $n"
          [ "$n" -eq 1 ] || { cargo tree --features "jit,physics" -i alice-det-math -e normal; exit 1; }
          cargo test --features "jit,physics" --test test_det_parity --test test_jit_sincos_det --test test_det_near_zero_parity

      # G3: glam's `fast-math` feature fuses its SSE2 mul_add when the fma target feature is on, and any
      # crate in the graph can enable it for the glam every crate shares. cargo metadata
      # with every feature, all targets; 0 glam packages seen fails. Linux only: the
      # resolved feature set does not depend on the host
      - name: glam fast-math feature is off (oracle, then the resolved graph)
        if: runner.os == 'Linux'
        run: |
          python3 scripts/test_glam_feature_check.py
          python3 scripts/glam_feature_check.py

      # naga の parse / validate のみで GPU adapter は使わない (gpu feature は naga を引くため)
      - name: Test (integration, NPR shader validation — glsl + gpu)
        run: cargo test --features "glsl,gpu" --test npr_shader_validate

      # compiled::rust の出力を rustc で compile・実行し eval_compiled と to_bits で突合する
      # (file 先頭が `#![cfg(feature = "rust")]`、feature 無しでは 0 本になる)
      - name: Test (integration, Rust source emit oracle — rust)
        run: cargo test --features rust --test test_rust_transpiler_oracle

      # SdfNode variant x backend support, compared with docs/node-support.md.
      # Every feature column (jit / msl / glsl / wgsl / hlsl / rust; msl turns on gpu, which carries WGSL) is on here, so every cell is compared.
      - name: Node backend support matrix (jit + msl + glsl + hlsl + rust)
        run: cargo test --features jit,msl,rust,glsl,hlsl --test test_node_backend_matrix

      # G3 on what the transpilers return: the node corpus through GLSL / WGSL / HLSL /
      # BlinkScript / MSL in both modes, no fused multiply-add intrinsic in the text
      - name: Shader text has no fused multiply-add (msl + glsl + hlsl + blinkscript)
        run: cargo test --features msl,glsl,hlsl,blinkscript --test test_shader_no_fused_multiply_add

      # FFI は extern "C" の実 export symbol を叩いて native evaluator と bit 突合する。
      # `cargo test --lib --features ffi,…` は unit のみで、この統合 test は走らない。
      # tests/ の extern "C" 宣言と src/ffi の export を「順序付きの型列」で突合する。
      # unreal-abi-check.sh step 2a は header / C# ⇔ export なので、test 内の宣言は
      # 第 3 の宣言箇所として無検査だった。引数順の誤りは SysV (macOS / Linux) では
      # 整数と浮動小数でレジスタバンクが分かれ独立に採番されるため値が正しい
      # レジスタに着いて通り、Microsoft x64 は位置でスロットを決めるので落ちる
      # (2026-09-30 run 36680136653 が Windows だけ red)。型の集合でなく順序付きの
      # 列で比べる必要がある。
      # 戻り値の型も比べる (2026-10-18 から、宣言の戻り値の誤りは全 target で link して通るため)
      - name: Guard (extern decl vs src/ffi export, ordered types and return type)
        # 1 行の && (Windows の pwsh は複数行の native command で最後の終了コードしか見ない)
        run: python3 scripts/test_abi_decl_check.py && python3 scripts/abi_decl_check.py

      - name: Test (integration, FFI binding oracle)
        run: cargo test --features ffi --test test_binding_oracle

      # godot は 1,510 行に対し test 0 で、clippy からも除外されていた
      # (security-audit.yml が grep -v godot)。engine 不要の部分だけを in-module test
      # で覆っている。⚠️ ubuntu に限定: 他 runner での gdext build は未検証なので、
      # 確認できたら広げる。
      - name: Test (godot GDExtension, ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: "cargo test --lib --features godot godot::"

      # HLSL / BlinkScript は naga frontend が無く、2026-09-30 まで出力文字列の検査
      # しか無かった。emit した HLSL を C++ shim と一緒に native binary にして
      # 2048 点を CPU 法と突合する (GPU / dxc / Vulkan 不要)。glslang があれば
      # parse gate も効かせる。ALICE_SDF_REQUIRE_CXX=1 で「compiler 不在なら
      # skip」を fail にする。
      #
      # ⚠️ 2026-09-30 の run 36682453187 で windows-latest だけが red になった。
      # 症状は corpus 152 node すべてが `evaluator exited with exit code: 3` で、
      # これは評価 binary 自身の `if (!read_exact(buf, 12)) { return 3; }` =
      # stdin が尽きたことを意味する。Windows の CRT は fd 0 / 1 を text mode で
      # 開き、入力側は最初の `0x1A` (Ctrl-Z) で読み取りを打ち切る。payload は生の
      # float bytes なので数百点のうちに `0x1A` が現れる。shim の self-test が
      # Windows でも通っていたのは、その 16 byte に `0x0A` も `0x1A` も無かった
      # ため。⇒ 両 main で `_setmode(0/1, _O_BINARY)` を呼ぶ形に直して再有効化した
      # (`tests/common/hlsl_cpu_shim.h` の ALICE_SDF_SET_BINARY_IO)。
      - name: Test (integration, HLSL / BlinkScript value parity)
        env:
          ALICE_SDF_REQUIRE_CXX: "1"
        run: cargo test --features "hlsl,blinkscript" --test test_hlsl_blinkscript_parity --test test_hlsl_export_oracle --test test_round_tie_parity --test test_shader_precise_temporaries

      # JIT の parity arm は書かれていたが CI で一度も実行されていなかった
      # (2026-09-30 実測)。`cargo test --tests` は default feature なので
      # test_det_parity / test_evaluator_opcode_parity 内の
      # `#[cfg(feature = "jit")]` (JitCompiledSdf / JitSimdSdf を tree
      # evaluator と突合する arm) と test_relaxed_tracing の
      # relaxed_tracing_matches_oracle_jit が丸ごと compile 対象外だった。
      # 下の `Build (JIT) [T3]` は build のみなので値の正しさは見ていない。
      # = 「cross-platform bit-exact determinism」の主張のうち JIT 経路だけ
      #   落ちる job を持っていなかった。
      #
      # test 本数では退行を検出できない: default でも test_det_parity は 1 /
      # test_evaluator_opcode_parity は 10 を報告し、消えるのは中の比較 arm
      # だけ。relaxed_tracing だけが 8 -> 9 と増える。本 step を消すと
      # 「green のまま JIT が未検証」に戻るので消さない。
      # ⚠️ 1 行で書く。この job は matrix に windows-latest を含み、Windows runner の
      # 既定 shell は pwsh なので、`run: |` + バックスラッシュ行継続 (bash 構文) は
      # `ParserError: Missing expression after unary operator '--'` で落ちる
      # (2026-09-30 実測、run 36675779379 = Linux / macOS は success で Windows のみ failure)。
      - name: Test (integration, JIT parity oracles) [T3]
        run: cargo test --features jit --test test_det_parity --test test_evaluator_opcode_parity --test test_relaxed_tracing --test test_raycast_oracle --test test_round_tie_parity --test test_jit_dynamic_oracle --test test_det_near_zero_parity --test test_det_near_zero_probe --test test_jit_sincos_det --test test_law_nan_operands

      # MSL は WGSL emit を naga で翻訳したもの (compiled::msl)。翻訳と binding map
      # の誤りはここでしか出ないので、macOS runner で Metal runtime compiler
      # (MTLDevice::newLibraryWithSource) に通して corpus 全 node を実行する。
      # ALICE_SDF_REQUIRE_METAL は設定しない: runner に Metal device が無い場合は
      # skip させ、権威ある実行は Apple Silicon 実機側 (worst 8.744e-5 を実測)。
      - name: Test (MSL → Metal oracle, macOS only)
        if: matrix.os == 'macos-latest'
        run: cargo test --features msl --test test_msl_metal_oracle -- --nocapture

      # ALICE-Law G8: the msl arms of tests/test_shader_text_provenance.rs (MslShader::from_wgsl
      # and its pinned twin, the MSL of the transpiler, the Nanite header form), counted
      - name: Test (shader text semantics identifier — msl, macOS only)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --features msl --test test_shader_text_provenance -- --nocapture 2>&1 | tee shader-text-provenance-msl.log
          python3 scripts/libtest_count.py shader-text-provenance-msl.log --min 13 --what "shader text provenance tests (msl)"

      # ALICE-Law G3: GpuEvaluator は macOS の msl で MslShader の MSL (fast math off) を
      # Metal で実行する その経路が積和を融合しないことを、この runner の Metal device で確かめる
      # (上の step で corpus が Metal で走っていることを確かめた device) device が無い時の skip は
      # ALICE_SDF_REQUIRE_METAL=1 で失敗にし、cfg_attr の ignore に落ちた時 (msl が外れた等) は
      # 走った件数 0 として libtest_count.py が失敗にする
      - name: Test (GpuEvaluator on Metal does not fuse a multiply-add, macOS only)
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          ALICE_SDF_REQUIRE_METAL: "1"
        run: |
          set -euo pipefail
          cargo test --features msl --test test_gpu_fma_contraction -- --nocapture 2>&1 | tee gpu-fma.log
          python3 scripts/libtest_count.py gpu-fma.log --min 1 --what "GpuEvaluator fma contraction tests (msl, Metal)"

      # doctest (= rustdoc 内 ```rust ブロック) は --lib / --tests では走らない
      # ``` の文字リテラル混入で doctest が落ちるのを予防
      - name: Test (doctests)
        run: cargo test --doc

      # `GpuEvalFuture<'a>` borrows its evaluator (5.0.0): a `compile_fail`
      # doctest pins that dropping the evaluator before `wait` does not compile
      # (until 5.0.0 it did, and `wait` read freed memory). The plain doctest
      # step above has no `gpu` feature, so these doctests only run here; the
      # count guard fails the step if the filter stops matching them. The count
      # is read by scripts/libtest_count.py, which strips escape codes first
      # (CARGO_TERM_COLOR=always above; tested on coloured libtest output).
      - name: Test (doctests, GpuEvalFuture lifetime)
        shell: bash
        run: |
          set -euo pipefail
          cargo test --doc --features gpu GpuEvalFuture 2>&1 | tee doc-gpu.log
          python3 scripts/libtest_count.py doc-gpu.log --min 2 --what "GpuEvalFuture doctests"

      # 2026-09-30: build -> test に格上げ。`src/ffi/**` には unit test が 15 本
      # あるが、`ffi` feature 付きの `cargo test` が CI に 1 つも無かったため
      # 一度も実行されていなかった (registry / panic sentinel / poisoned lock /
      # compiled + batch + SoA eval)。local 実測で 1653 passed / 0 failed。
      - name: Test (FFI + shaders)
        run: cargo test --lib --features "ffi,hlsl,glsl"

      - name: Build (no default features) [T0]
        run: cargo build --lib --no-default-features

      - name: Build (JIT) [T3]
        run: cargo build --lib --no-default-features --features "jit"

      # Bridges resolve to crates.io siblings since 1.12.0 — hard gate
      # (this step was continue-on-error against non-existent features).
      - name: Build + test (bridges physics / codec / asp / sdf-cache) [T3]
        run: cargo test --lib --no-default-features --features "physics,codec,asp,sdf-cache"

      # unity / unreal = ffi + shader: every extern "C" fn is panic-isolated
      # (ffi_guard), so these are hard gates (continue-on-error removed 1.11.0)
      - name: Build (Unity meta) [T2]
        run: cargo build --lib --no-default-features --features "unity"

      - name: Build (Unreal meta) [T2]
        run: cargo build --lib --no-default-features --features "unreal"

      # Hard gate since 1.12.0 (was continue-on-error; it hid scene_composer
      # tests that built GLSL / HLSL without those transpilers enabled).
      - name: Test (AAA meta) [T4]
        run: cargo test --lib --no-default-features --features "aaa"

      - name: Benchmark compilation check
        run: cargo bench --no-run

  # 配線ガード: 実装したが production から呼ばれていない pub item と、理由の無い
  # allow(dead_code) の新規追加を止める (既存分は scripts/wiring-baseline.txt)
  # 検査器自身が OS 依存で空振り / 異常終了しないよう 3 OS で動かす
  # (検査対象 0 件は empty_scan で fail する) 軽量なので paths-filter の対象外にして常に走らせる
  wiring-guard:
    name: Wiring guard (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Concurrency of every branch-push workflow (test, then check)
        run: |
          python scripts/test_workflow_concurrency.py
          python scripts/workflow_concurrency.py
      - name: wiring-guard oracle (検査器自身の試験)
        run: python scripts/test_wiring_guard.py
      - name: wiring-guard (新規の未配線 / 理由の無い dead_code が無い)
        run: python scripts/wiring_guard.py
      - name: CI test coverage oracle (検査器自身の試験)
        run: python scripts/test_ci_test_coverage_check.py
      - name: CI test coverage (feature 付き oracle を走らせる cargo test が CI にある)
        run: python scripts/ci_test_coverage_check.py
      - name: status generators oracle (台帳の生成器自身の試験)
        run: python scripts/test_gen_status.py
      # the preflight mirror of law-readme-block.yml (the check itself runs there, here its tests)
      - name: README ALICE-Law block preflight check (tests)
        run: python scripts/test_law_readme_block_check.py
      - name: status generators (走査件数 0 で fail)
        run: |
          python scripts/gen-wiring-status.py
          python scripts/gen-oracle-status.py
      - name: docs lint oracle (検査器自身の試験)
        run: python scripts/test_docs_lint.py
      - name: docs lint (CHANGELOG の構造、比較 0 件で fail、公開してはいけない語は public-text.yml)
        run: python scripts/docs_lint.py --check
      # what a release ships is read with the ALICE-Law public-text checker (scripts/release_artifact_audit.py
      # in release.yml and release-wheels.yml, on each of their OSes); its tests build a small Rust
      # program with rustc. Here, not in the shared public-text.yml, whose bytes the registry pins
      - name: release artifact audit oracle (検査器自身の試験)
        run: python scripts/test_release_artifact_audit.py
      - name: tracked binaries oracle (検査器自身の試験)
        run: python scripts/test_tracked_binaries.py
      - name: tracked binaries (build した library を commit しない、走査 0 件で fail)
        run: python scripts/tracked_binaries.py
      - name: raw max/min manifest oracle (検査器自身の試験)
        run: python scripts/test_raw_minmax_manifest.py
      - name: raw max/min manifest (raw helper の使用は一覧と数が一致、src/npr/ の外では 0、走査 0 件で fail)
        run: python scripts/raw_minmax_manifest.py
      # 数を上げる時は why の変更が要る (main の一覧と比べる)
      - name: raw max/min manifest against main (count rises need a new why)
        if: runner.os == 'Linux' && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          git fetch --depth=1 origin main
          python scripts/raw_minmax_manifest.py --base FETCH_HEAD
      - name: library clippy config oracle (検査器自身の試験)
        run: python scripts/test_clippy_lib_gate.py
      - name: library clippy config is generated from clippy.toml
        run: python scripts/clippy_lib_gate.py --check
      # G3 on the shader text: no fma( / fmaf( / mad( in a string literal of src/ (the
      # transpilers and templates write shader source as literals clippy does not read)
      - name: shader fused multiply-add guard oracle (検査器自身の試験)
        run: python scripts/test_shader_fma_guard.py
      - name: shader fused multiply-add guard (string literals of src/, 0 literals fails)
        run: python scripts/shader_fma_guard.py
      - name: license copy oracle (検査器自身の試験)
        run: python3 scripts/license_copy_check.py --self-test
      - name: license copy (sub-package の license が root と byte 一致、比較 0 件で fail)
        run: python3 scripts/license_copy_check.py
      - name: license declarations oracle (検査器自身の試験)
        run: python3 scripts/license_check.py --self-test
      - name: license declarations (全 manifest の license が Apache-2.0、Community subtree は許可リスト、比較 0 件で fail)
        run: python3 scripts/license_check.py
      # G1, libm half: a direct libm dependency must come with the libm:: ban
      # in clippy.toml and scripts/libm_ban_check.py (0 manifests read fails)
      - name: libm dependency guard (test, then check)
        run: |
          python scripts/test_libm_dependency_guard.py
          python scripts/libm_dependency_guard.py
      # G14, static half: no build configuration, workflow, script or source sets a
      # native-CPU, fast-math or x87 flag (scripts/build_config_allowlist.toml lists
      # the files that quote them on purpose; nothing read fails). The dynamic half
      # (the flags cargo really passes) runs in release-profile.yml
      # G13: the library's hash collections are src/unordered.rs's wrappers, which
      # cannot be iterated (tests/test_unordered_no_iteration.rs); the types are
      # banned elsewhere by the library clippy configuration
      # G10: the default build (the Law path) links permissive crates only; the
      # optional AGPL bridges (physics / codec / sdf-cache) stay outside it
      - name: Default-build dependency licences (test, then check)
        run: |
          python scripts/test_default_dependency_licenses.py
          python scripts/default_dependency_licenses.py
      # G13 text layer: every HashMap / HashSet, rayon / thread and pointer-order line
      # of src/ is listed in scripts/order_allowlist.toml with its count, the SHA-256 of
      # each line and the reason (the type-resolved layer is the library clippy run);
      # G10 text layer: no OS entropy or wall clock outside the CLI's timings
      - name: Order and entropy guards (test, then check)
        run: |
          python scripts/test_order_guard.py
          python scripts/order_guard.py
          python scripts/entropy_guard.py
      - name: Build configuration guard (test, then check)
        run: |
          python scripts/test_build_config_guard.py
          python scripts/build_config_guard.py
          python scripts/test_build_flags_check.py
      # G8: every public writer stores the semantics identifier or is listed as pending
      # (the number of writers is fixed; 0 writers found fails)
      - name: provenance writers (test, then check)
        run: |
          python scripts/test_provenance_writers.py
          python scripts/provenance_writers.py
      # G8: the tree types keep Deserialize; the library clippy configuration forbids the
      # serde_json / bincode read entry points, so each read in src is a site marked with a
      # stored form checked / other-type / pending reason. This lists the sites and checks the
      # reasons (0 sites fails); the hidden check below shows none hides under another allow
      - name: bare deserialization reads (test, then check)
        run: |
          python scripts/test_bare_serde_reads.py
          python scripts/bare_serde_reads.py
      - name: README sync oracle (検査器自身の試験)
        run: python scripts/test_readme_sync.py
      - name: README sync (feature 表 / MSRV / 使用例 / MODULES.md が code と一致、比較 0 件で fail)
        run: python scripts/readme_sync.py --check
      - name: Version sync checker (tests)
        run: python scripts/test_version_sync.py
      - name: Version sync (metadata and install lines follow Cargo.toml)
        run: python scripts/version_sync.py --check
      # ALICE-Law G11 (c): the files shared with the other crates are the bytes ALICE-Law's
      # table records (table and checker fetched at .github/shared-files-pin, both SHA-256
      # pinned); a difference, an unlisted shared path or nothing compared fails
      - name: Shared files equal ALICE-Law's table
        shell: bash
        run: |
          python3 scripts/test_shared_files.py
          scripts/shared_files.sh
      # cargo / libtest / cargo-semver-checks の出力を読む parser は、CARGO_TERM_COLOR=always
      # (この workflow の env) の色付き出力で試験する。検査器は parser の test に色付き
      # sample が無いと fail し、parser を 1 件も見つけられなくても fail する
      - name: cargo output parsers oracle (色付き出力で試験)
        run: |
          python scripts/test_ansi.py
          python scripts/test_libtest_count.py
          python scripts/test_cargo_output_parser_check.py
      - name: cargo output parsers (test に色付き sample がある、対象 0 件で fail)
        run: python scripts/cargo_output_parser_check.py

  # Reach of every pub item with references resolved by rust-analyzer (SCIP).
  # wiring-guard above matches names, so `impl Foo {}` alone or a same-named
  # method elsewhere counts as a caller; this job resolves each reference to one
  # definition. It fails on a new pub item that no non-test code reaches (L0),
  # on a baseline line that is no longer L0, and on a stale
  # docs/integration-status.md. Indexing takes about 4 minutes, so it runs once,
  # on Linux (the index is built for a fixed target and does not depend on the OS).
  scip:
    name: SCIP reach (L0 ratchet, integration ledger)
    needs: changes
    if: needs.changes.outputs.scip == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # pyo3's build script (python feature) needs an interpreter; tomllib needs 3.11+
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # rust-toolchain.toml pins the toolchain; rust-analyzer comes from the same pin.
      # The wasm index is built for wasm32-unknown-unknown.
      - name: Install rust-analyzer and the wasm32 target
        run: |
          rustup show active-toolchain
          rustup component add rust-analyzer
          rustup target add wasm32-unknown-unknown
          rust-analyzer --version
      - uses: Swatinem/rust-cache@v2
      - name: scip_reach oracle (検査器自身の試験)
        run: |
          python3 scripts/test_scip_reach.py
          python3 scripts/test_scip_scope.py
      - name: Build SCIP indexes
        run: scripts/scip_index.sh
      - name: No new L0 item, no stale baseline entry
        run: python3 scripts/scip_reach.py --check-baseline
      # ALICE-Law G7: a `local` boundary entry must not reach a declared parser (the same index,
      # built above from this commit; the script refuses an index of another commit)
      - name: No local boundary entry reaches a parser
        run: |
          python3 scripts/test_api_boundary_parsers.py
          python3 scripts/api_boundary_parsers.py
      # ALICE-Law G8: every entry the call graph shows reaching a write sink (a trait-impl method
      # included, which the text scan of the wiring-guard job cannot see) is a covered, pending or
      # reasoned not-writer entry (the same index, of this commit)
      - name: Every writer the call graph finds is classified
        run: python3 scripts/provenance_writers.py --index target/scip
      - name: docs/integration-status.md is up to date
        run: |
          python3 scripts/scip_reach.py --write docs/integration-status.md
          if ! git diff --exit-code docs/integration-status.md; then
            echo "::error::docs/integration-status.md is stale: run 'scripts/scip_index.sh && python3 scripts/scip_reach.py --write docs/integration-status.md' and commit the result"
            exit 1
          fi

  # ALICE-Law G7 on the other hosts: rustdoc documents the host it runs on, so an entry point
  # compiled only on macOS or Windows (a dependency's macro behind cfg(target_os)) is enumerated
  # only there. The same check as the clippy job's 'API boundary manifest' step, per OS; each leg
  # fails when it enumerated nothing (api_boundary.py), and the `host` table's keys of another OS
  # print a PREFLIGHT-SKIP line instead of being compared.
  # Runs only when something that changes the boundary changed (the `boundary` filter); the
  # workflow's concurrency cancels a superseded run on ci/** and keeps one run per commit on main.
  api-boundary-os:
    name: API boundary (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.boundary == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # pyo3's build script (python feature) needs an interpreter; tomllib needs 3.11+
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # rust-toolchain.toml pins the toolchain: the wasm32 target is added to the pinned one (a
      # missing target fails the run, as in the clippy job)
      - name: wasm32 target for the pinned toolchain
        run: rustup target add wasm32-unknown-unknown
      # 1 行の && (Windows の pwsh は複数行の native command で最後の終了コードしか見ない)
      - name: API boundary manifest on this OS (tests, then check, 0 compared fails)
        run: python3 scripts/test_api_boundary.py && python3 scripts/api_boundary.py

  wasm:
    name: WebAssembly (wasm32) cross-compile
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # rust-toolchain.toml (= channel 1.92.0 pin) があると dtolnay action の
      # targets: パラメータが stable に追加されるだけで、active toolchain 1.92.0 に
      # は反映されない E0463 can't find crate for `core` 回避のため明示追加
      - name: Ensure wasm32 target on pinned toolchain
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build (wasm feature, wasm32 target)
        run: cargo build --lib --no-default-features --features wasm --target wasm32-unknown-unknown
      - name: Test wasm (host, lib-only)
        run: cargo build --lib --no-default-features --features wasm

  openvdb:
    name: OpenVDB I/O
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (openvdb feature)
        run: cargo build --lib --no-default-features --features openvdb
      - name: Test (openvdb feature)
        run: cargo test --lib --no-default-features --features openvdb vdb
      # tests/test_io_format_oracle.rs の dense grid (openvdb) と Nanite material (hlsl) の arm
      - name: Test (io format oracle — openvdb + hlsl arms)
        run: cargo test --features "hlsl,openvdb" --test test_io_format_oracle
      # the ALICE-VDB grid's semantics identifier (tests/test_provenance.rs, alice_vdb_*, gated on
      # openvdb, which the aaa step does not enable): 3 tests, fewer fails
      - name: Test (provenance of the ALICE-VDB grid — openvdb)
        shell: bash
        run: |
          set -euo pipefail
          cargo test --features openvdb --test test_provenance alice_vdb 2>&1 | tee provenance-vdb.log
          python3 scripts/libtest_count.py provenance-vdb.log --min 3 --what "ALICE-VDB provenance tests (openvdb)"

  # The .abc writer against the Alembic library: tests/oracle/alembic_reader.cpp reads what this
  # crate writes and tests/oracle/alembic_refwriter.cpp writes the same mesh with the library, and
  # tests/test_alembic_oracle.rs compares them bit for bit (positions, faces, normals, UVs, the
  # identifier in the archive metadata, object / property hashes, sample digests). The tests are
  # #[ignore] elsewhere because they need the library; here a missing program panics and fewer
  # than 3 passing tests fail the job.
  alembic-oracle:
    name: Alembic library oracle (.abc)
    needs: changes
    if: needs.changes.outputs.alembic == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # No Ubuntu or Debian stable release packages the Alembic C++ library (measured 2026-10-21:
      # noble, noble-updates and jammy universe, Debian bookworm and trixie), so the job builds the
      # release in tests/oracle/alembic-library.txt from its tag tarball, Ogawa back end only
      - name: Read the pinned Alembic release
        shell: bash
        run: |
          set -euo pipefail
          pin=tests/oracle/alembic-library.txt
          field() { awk -v k="$1" '$1 == k { print $2 }' "$pin"; }
          {
            echo "ALEMBIC_VERSION=$(field version)"
            echo "ALEMBIC_URL=$(field url)"
            echo "ALEMBIC_SHA256=$(field sha256)"
            echo "ALEMBIC_PREFIX=$RUNNER_TEMP/alembic-prefix"
          } >> "$GITHUB_ENV"
          echo "pinned Alembic $(field version) sha256 $(field sha256)"
      - name: Install Imath and cmake
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libimath-dev cmake
      - name: Cache the Alembic build
        id: alembic-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/alembic-prefix
          key: alembic-${{ env.ALEMBIC_VERSION }}-${{ env.ALEMBIC_SHA256 }}-ogawa-${{ runner.os }}
      - name: Print the cache key
        run: |
          echo "cache key: alembic-${ALEMBIC_VERSION}-${ALEMBIC_SHA256}-ogawa-${RUNNER_OS} hit=${{ steps.alembic-cache.outputs.cache-hit }}"
      - name: Build the Alembic library (Ogawa only)
        if: steps.alembic-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL "$ALEMBIC_URL" -o alembic.tar.gz
          # the sha256 is checked before anything is extracted; a mismatch stops the job here
          echo "$ALEMBIC_SHA256  alembic.tar.gz" | sha256sum -c -
          mkdir alembic-src
          tar -xzf alembic.tar.gz -C alembic-src --strip-components=1
          cmake -S alembic-src -B alembic-build -DCMAKE_BUILD_TYPE=Release -DUSE_HDF5=OFF \
            -DUSE_TESTS=OFF -DUSE_BINARIES=OFF -DUSE_EXAMPLES=OFF -DALEMBIC_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_PREFIX="$ALEMBIC_PREFIX"
          cmake --build alembic-build -j "$(nproc)"
          cmake --install alembic-build
      - name: Check the Alembic library (version and Ogawa only, also on a cache hit)
        run: |
          python3 scripts/test_alembic_library_check.py
          python3 scripts/alembic_library_check.py "$ALEMBIC_PREFIX/include" --ogawa-only
      - name: Build the oracle programs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/alembic-oracle
          lib="$ALEMBIC_PREFIX/lib"
          for n in alembic_reader alembic_refwriter; do
            g++ -std=c++17 -O1 -I"$ALEMBIC_PREFIX/include" -I/usr/include/Imath "tests/oracle/$n.cpp" \
              -L"$lib" -Wl,-rpath,"$lib" -lAlembic -o "target/alembic-oracle/$n"
          done
          # the reader is linked against this build, not another copy on the system
          ldd target/alembic-oracle/alembic_reader | grep -F "$lib/libAlembic"
      - name: Test (Alembic oracle)
        shell: bash
        run: |
          set -euo pipefail
          export ALICE_SDF_ALEMBIC_READER="$PWD/target/alembic-oracle/alembic_reader"
          export ALICE_SDF_ALEMBIC_REFWRITER="$PWD/target/alembic-oracle/alembic_refwriter"
          cargo test --test test_alembic_oracle -- --ignored 2>&1 | tee alembic-oracle.log
          python3 scripts/libtest_count.py alembic-oracle.log --min 3 --what "Alembic oracle tests"

  bevy:
    name: Bevy plugin (bindings/bevy/alice-sdf-bevy)
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/bevy/alice-sdf-bevy
      - name: Install bevy build deps (Linux)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: Build (lib)
        working-directory: bindings/bevy/alice-sdf-bevy
        run: cargo build --lib
      - name: Test (lib)
        working-directory: bindings/bevy/alice-sdf-bevy
        run: cargo test --lib

  bridges:
    name: Bridges (each feature alone, no stubs)
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Every bridge on its own (a feature must not depend on another one
      # being enabled) with the real crates.io deps — no alice-stubs action.
      - name: physics
        run: cargo test --lib --no-default-features --features "physics"
      - name: codec
        run: cargo test --lib --no-default-features --features "codec"
      - name: asp
        run: cargo test --lib --no-default-features --features "asp"
      - name: sdf-cache
        run: cargo test --lib --no-default-features --features "sdf-cache"
      - name: clippy (all bridges, -D warnings)
        run: cargo clippy --lib --features "physics,codec,asp,sdf-cache" -- -D warnings
      # Integration oracles of the bridges (files start with `#![cfg(feature = …)]`,
      # so the default `cargo test --tests` builds them empty). `gpu` compiles the
      # GPU MC + physics case; without an adapter it skips (ALICE_SDF_REQUIRE_GPU unset).
      - name: bridge oracles (codec / asp / sdf-cache / sim)
        run: cargo test --features "physics,codec,asp,sdf-cache,gpu" --test test_codec_bridge_oracle --test test_asp_bridge_oracle --test test_g8_tree_text --test test_sdf_eval_cache_oracle --test test_sim_bridge_oracle

  mobile:
    name: Mobile — iOS / Android cross-compile
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || needs.changes.outputs.code == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            mobile/uniffi-wrapper

      # tests/test_metal_library_from_source_only.rs reads `cargo metadata --locked --offline`,
      # which resolves every platform's dependencies, so the cache has to hold all of them, not
      # only what this host builds (a cold cache lacks e.g. the Windows-only anstyle-wincon)
      - name: Fetch every platform's locked crates
        run: cargo fetch --locked

      - name: Add mobile rustup targets
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk

      - name: Install Android NDK (cached by setup-java)
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Build host (lib + uniffi-bindgen binary)
        working-directory: mobile/uniffi-wrapper
        run: cargo build --release

      - name: Build iOS aarch64 (device)
        working-directory: mobile/uniffi-wrapper
        run: cargo build --release --target aarch64-apple-ios

      - name: Build iOS aarch64 (sim)
        working-directory: mobile/uniffi-wrapper
        run: cargo build --release --target aarch64-apple-ios-sim

      - name: Build iOS x86_64 (sim, Intel Mac)
        working-directory: mobile/uniffi-wrapper
        run: cargo build --release --target x86_64-apple-ios

      - name: Build iOS aarch64 with gpu (Metal backend)
        working-directory: mobile/uniffi-wrapper
        run: cargo build --release --target aarch64-apple-ios --features gpu

      - name: Build Android 4 ABIs
        working-directory: mobile/uniffi-wrapper
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo ndk \
            -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 \
            build --lib --release

      - name: Verify Swift bindings generate clean
        working-directory: mobile/uniffi-wrapper
        run: |
          cargo run --release --bin uniffi-bindgen -- \
            generate src/alice_sdf.udl \
            --language swift \
            --out-dir /tmp/ci-swift

      - name: Verify Kotlin bindings generate clean
        working-directory: mobile/uniffi-wrapper
        run: |
          cargo run --release --bin uniffi-bindgen -- \
            generate src/alice_sdf.udl \
            --language kotlin \
            --out-dir /tmp/ci-kotlin

      # Integration tests over the 12 publicly-exported wrapper functions.
      # Release プロファイルは `panic = "abort"` のため integration test の
      # 動的 unwind との互換が取れない → debug プロファイルで実行する。
      - name: Run integration tests (debug)
        working-directory: mobile/uniffi-wrapper
        run: cargo test --tests

  clippy:
    name: Clippy (core strict, -D warnings)
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    env:
      # every feature of Cargo.toml except `wasm`, which builds for wasm32 only and is
      # linted by the wasm32 step below; scripts/clippy_feature_coverage.py checks
      # that the two together name every feature
      LINT_FEATURES: "aaa,all-shaders,asp,blinkscript,cli,codec,destruction,ffi,font,gi,glsl,godot,gpu,gpu-mesh,hlsl,image,jit,msl,openvdb,physics,python,rust,sdf-cache,svo,svo-gpu,terrain,texture-fit,unity,unreal,volume"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # core src/** は strict (-D warnings)。v1.7.2 で informational から格上げ。
      # 新しい clippy lint (Rust リリース毎に追加される) が混入したら CI で即発覚させる。
      # ALICE-Law G1: the clippy runs of this job together turn on every feature of
      # Cargo.toml (a feature no run compiles is never seen by clippy.toml's bans)
      - name: clippy feature coverage (oracle, then check)
        run: |
          python3 scripts/test_clippy_feature_coverage.py
          python3 scripts/clippy_feature_coverage.py
      - name: Clippy strict (no-default-features)
        run: cargo clippy --lib --no-default-features
        env:
          RUSTFLAGS: "-Dwarnings"

      # --all-targets: tests / benches / examples も lint 対象
      - name: Clippy strict (default, all targets)
        run: cargo clippy --all-targets
        env:
          RUSTFLAGS: "-Dwarnings"

      # Every feature-gated module is linted (the crate-wide pedantic /
      # nursery policy in Cargo.toml applies to whatever is compiled): every
      # feature but wasm, which the wasm32 step lints (ALICE-Law G1).
      - name: Clippy strict (every feature but wasm, all targets)
        run: cargo clippy --all-targets --features "$LINT_FEATURES"
        env:
          RUSTFLAGS: "-Dwarnings"

      # The library code also may not call f32 / f64 / f32x8 max and min (the sign
      # of an equal pair of zeros differs between aarch64 and x86_64): it uses the
      # Law helpers, or the raw helpers counted in scripts/raw_minmax_manifest.toml.
      # .github/clippy-lib/clippy.toml is generated from clippy.toml; the script
      # checks it is current and that clippy with it flags each of the canary's
      # forbidden forms (a configuration clippy does not read cannot pass)
      - name: Clippy (library code, f32 / f64 / f32x8 max and min forbidden)
        env:
          CLIPPY_CONF_DIR: .github/clippy-lib
          RUSTFLAGS: "-Dwarnings"
        run: cargo clippy --lib --features "$LINT_FEATURES"
      # the wasm module only compiles for wasm32 (src/lib.rs: feature wasm and
      # target_arch wasm32): the same max / min ban there, and every other lint
      # denied, as for the other features (ALICE-Law G1)
      - name: Clippy (library code on wasm32, max and min forbidden)
        env:
          CLIPPY_CONF_DIR: .github/clippy-lib
          RUSTFLAGS: "-Dwarnings"
        run: |
          rustup target add wasm32-unknown-unknown
          cargo clippy --lib --target wasm32-unknown-unknown --features wasm
      - name: Library clippy configuration is current and fires (canary)
        run: python3 scripts/clippy_lib_gate.py
      # The same lint carries the libm ban, so a function-level allow written for
      # libm would also hide a max / min: lift every such allow in a scratch copy and
      # require no max / min diagnostic outside src/raw_minmax.rs (0 compared fails)
      - name: Hidden max / min check (tests)
        run: python3 scripts/test_clippy_lib_hidden_check.py
      - name: No max / min hides under an allow of the lint
        run: python3 scripts/clippy_lib_hidden_check.py --features "$LINT_FEATURES"
      # ALICE-Law G7: every entry point that takes bytes, text, a reader, an extern "C" /
      # pyo3 call or a wasm32-only export is listed in scripts/api_boundary.toml with a
      # decision (handshake / local / pending). The wasm32 target installed above is
      # required here: without it the run fails (preflight skips it out loud instead)
      - name: API boundary manifest (tests, then check, 0 compared fails)
        run: |
          python3 scripts/test_api_boundary.py
          python3 -c 'import os, tomllib; f = tomllib.load(open("scripts/api_boundary.toml", "rb"))["features"]; assert f == os.environ["LINT_FEATURES"], ("scripts/api_boundary.toml features differ from LINT_FEATURES", f)'
          python3 scripts/api_boundary.py

      # examples/gpu_eval.rs は required-features = ["gpu"] なので default CI では
      # compile されない (1.9.2 まで API drift で壊れたまま気付かなかった)
      - name: Build feature-gated examples (gpu / glsl / hlsl / blinkscript / msl / rust)
        run: cargo build --examples --features "glsl,hlsl,blinkscript,gpu,msl,rust"
        env:
          RUSTFLAGS: "-Dwarnings"

  clippy-strict:
    name: Clippy strict (mobile wrapper, includes alice-sdf path dep)
    needs: changes
    # mobile/uniffi-wrapper は alice-sdf core を path dep として再 clippy する。
    # core (src/**) 変更時にも厳格化を効かせるため code もトリガに含める。
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.mobile == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile/uniffi-wrapper

      # 新規 mobile/ クレートは厳格 (-D warnings)
      - name: Clippy strict (mobile/uniffi-wrapper)
        working-directory: mobile/uniffi-wrapper
        env:
          RUSTFLAGS: "-Dwarnings"
        run: cargo clippy --lib --all-targets

  fmt:
    name: Format
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.mobile == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting (core)
        run: cargo fmt --check

      - name: Check formatting (mobile/uniffi-wrapper)
        working-directory: mobile/uniffi-wrapper
        run: cargo fmt --check

  msrv:
    name: MSRV (rust-version = 1.85)
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Cargo.toml `rust-version` を実証する。
      # 宣言値と同じ toolchain を pin し、default feature + docs.rs feature set
      # で `cargo check` が通ることを確認する。宣言を上げる時はここも上げる。
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2

      - name: Check (default features)
        run: cargo check --lib

      - name: Check (docs.rs feature set)
        run: cargo check --lib --features "glsl,hlsl,jit,svo,terrain,destruction,gi,ffi,rust"

  # The transpilers' only correctness oracle runs the generated WGSL on a real
  # wgpu device (tests/test_gpu_law_parity.rs etc.). GitHub runners have no
  # GPU, so this job installs Mesa's software Vulkan driver (lavapipe) and
  # requires an adapter (ALICE_SDF_REQUIRE_GPU=1 turns "no adapter → skip"
  # into a failure). Until 1.11.0 these tests had never run in CI
  # (external review 2026-09-15, SDF-3 / SDF-R2-7).
  gpu-parity:
    name: GPU parity (lavapipe)
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    env:
      ALICE_SDF_REQUIRE_GPU: "1"
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The lavapipe ICD file name depends on the Mesa build
      # (`lvp_icd.x86_64.json` up to 24.x, `lvp_icd.json` from 25.x on
      # noble-updates): locate it instead of hard-coding, and prove the loader
      # sees llvmpipe before spending a build on the tests.
      - name: Install Mesa software Vulkan (lavapipe)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools
          icd=$(find /usr/share/vulkan/icd.d -name "lvp_icd*.json" | head -1)
          echo "lavapipe ICD: $icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$icd" vulkaninfo --summary | tee /tmp/vulkaninfo.txt | head -60
          grep -qi llvmpipe /tmp/vulkaninfo.txt

      - name: GPU ↔ CPU law parity, shader validation, GPU marching cubes
        run: >
          cargo test --features "gpu,glsl,gpu-mesh,texture-fit"
          --test test_gpu_law_parity
          --test test_gpu_noise_parity
          --test test_round_tie_parity
          --test test_transpiler_naga_validate
          --test noise_shader_validate
          --test test_mesh_orientation
          --test test_mc_shared_vertex_oracle
          --test test_texture_shader_gpu_parity
          --test test_npr_bytecode_gpu_parity
          --test test_instanced_wgsl_gpu_parity
          --test test_gpu_eval_api_oracle
          --test test_glsl_export_oracle
          --test test_shader_precise_temporaries
          -- --nocapture

      # ALICE-Law G8: the whole shader text carries the semantics identifier and the four
      # readers that compile shader text check it (tests/test_shader_text_provenance.rs). The
      # accepted cases build an evaluator, so they run here on lavapipe; the arms of
      # gpu / glsl / hlsl / volume / blinkscript / texture-fit compile only with those features
      # (the WHOLE / FRAGMENT check derives every table entry from its output only when the
      # entry's feature is on), counted so a feature set that drops them cannot pass with 0
      # tests (the msl arms run in the macOS test job)
      - name: Shader text semantics identifier (gpu, glsl, hlsl, volume, blinkscript, texture-fit)
        shell: bash
        run: |
          set -euo pipefail
          cargo test --features "gpu,glsl,hlsl,volume,blinkscript,texture-fit" --test test_shader_text_provenance -- --nocapture 2>&1 | tee shader-text-provenance.log
          python3 scripts/libtest_count.py shader-text-provenance.log --min 14 --what "shader text provenance tests (gpu, glsl, hlsl, volume, blinkscript, texture-fit)"

      # The GPU unit tests (src/compiled/wgsl/gpu_eval.rs, src/mesh/gpu_marching_cubes.rs)
      # return early without a usable device and libtest still says ok; each prints
      # `gpu-test: ran` or `gpu-test: skipped` (`gpu_test_support` in src/lib.rs). Here a device
      # exists and ALICE_SDF_REQUIRE_GPU=1 makes a skip fail; the count makes sure the
      # six tests ran at all (a filter that matches nothing also says ok)
      - name: GPU unit tests ran, not skipped (6)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_gpu_test_count.py
          cargo test --lib --features "gpu,gpu-mesh" test_gpu_ -- --nocapture --test-threads=1 2>&1 | tee gpu-unit.log
          python3 scripts/gpu_test_count.py gpu-unit.log --ran 6 --max-skipped 0

      # aaa 側の GPU oracle (volume の gpu_bake)。上の step とは feature 集合が違う
      # ので分けている。ALICE_SDF_REQUIRE_GPU=1 は job env で設定済なので、
      # adapter 不在は silent skip でなく assert 失敗になる
      - name: GPU ↔ CPU parity (aaa — volume gpu_bake)
        run: cargo test --features "aaa" --test test_gi_volume_oracle --test test_volume_api_oracle -- --nocapture

      # LiveSdf の SdfNode 形 (基底 − crater) の GPU marching cubes と CPU の chunk mesh の突合
      - name: GPU ↔ CPU parity (physics — LiveSdf gpu_mesh)
        run: cargo test --features "physics,gpu" --test test_live_sdf_gpu_parity -- --nocapture

  doc:
    name: Doc (RUSTDOCFLAGS=-Dwarnings)
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # rustdoc warning (broken link / missing example 等) を CI で deny
      - name: cargo doc (core, no-deps)
        run: cargo doc --lib --no-deps
        env:
          RUSTDOCFLAGS: "-Dwarnings"

      # docs.rs builds with this feature set (+ texture-fit, whose intra-doc
      # links to private SIMD items were only visible with the feature on).
      - name: cargo doc (docs.rs feature set + texture-fit)
        run: cargo doc --lib --no-deps --features "glsl,hlsl,jit,svo,terrain,destruction,gi,ffi,rust,texture-fit"
        env:
          RUSTDOCFLAGS: "-Dwarnings"

  vrchat-host:
    name: VRChat host parity (C# collider vs alice_sdf golden)
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.vrchat == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      # Sample*_Collider.cs は UdonSharp 向けで Unity でしか compile されない
      # → UnityEngine stub 相手に C# 7.3 -warnaserror で compile し、EvaluateSdf を
      # examples/vrchat_*_golden.rs (alice_sdf::eval) と突合 (Mochi 1521 点 +
      # TerrainSculpt 4335 点 + DeformableWall 5100 点 + 静的 4 sample) + 各 sample の behaviour シナリオ
      # (vrchat-package/HostTests~/README.md)
      - name: VRChat sample parity + behaviour (7 samples)
        run: scripts/vrchat-host-parity.sh

  # The UE5 plugin's contract with the crate, checked without Unreal: the
  # shipped header == include/alice_sdf.h, header prototypes ⇔ cdylib exports
  # (--features unreal), .uplugin metadata, shader includes, and the generated
  # corpus oracle files (examples/unreal_corpus_oracle.rs). From 1.7.2 to 3.1.0
  # the header was 15 lines behind, two declared functions were not exported
  # and eight exports had no prototype — nothing here ran.
  unreal-abi:
    name: Unreal plugin ABI (header ⇔ exports, uplugin, generated corpus)
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.unreal == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: unreal-abi-check
        run: scripts/unreal-abi-check.sh

  # BuildPlugin (35-50 分) は `.github/workflows/unreal.yml` に分離した。ここに置くと
  # doc だけの push でも concurrency: cancel-in-progress で完走前に消え、新 run は
  # paths-filter で skip されて検証が進まない (2026-09-27 に 2 回起きた)。
  # `unreal-abi` (上) は ubuntu で短時間なので ci.yml に残している。

  actionlint:
    name: actionlint (workflow YAML 検証)
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # `run:` 末尾 `::` で 0 秒 failure になる等の YAML の誤りを予防
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check

  server-smoke:
    name: REST server smoke test
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Build server
        working-directory: server
        run: cargo build --release

      - name: Start server in background
        working-directory: server
        run: |
          ./target/release/alice-sdf-server &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> "$GITHUB_ENV"
          sleep 2

      - name: Smoke /version
        run: |
          curl -fsS http://localhost:8787/version | grep -q "alice-sdf-server"

      - name: Smoke /eval (sphere)
        run: |
          RESULT=$(curl -fsS -X POST http://localhost:8787/eval \
            -H 'Content-Type: application/json' \
            -d '{"shape":"sphere","point":[2.0,0,0],"params":{"radius":1.0}}')
          echo "Response: $RESULT"
          echo "$RESULT" | grep -q '"distance":1'

      - name: Smoke /op (smooth_union)
        run: |
          RESULT=$(curl -fsS -X POST http://localhost:8787/op \
            -H 'Content-Type: application/json' \
            -d '{"op":"smooth_union","a":0.3,"b":-0.2,"k":0.1}')
          echo "Response: $RESULT"
          echo "$RESULT" | grep -q '"distance"'

      - name: Smoke /mesh (sphere, res=16)
        run: |
          RESULT=$(curl -fsS -X POST http://localhost:8787/mesh \
            -H 'Content-Type: application/json' \
            -d '{"shape":"sphere","params":{"radius":1.0},"resolution":16}')
          echo "$RESULT" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['vertex_count']>100, d"

      - name: Smoke /splat (sphere, res=12)
        run: |
          RESULT=$(curl -fsS -X POST http://localhost:8787/splat \
            -H 'Content-Type: application/json' \
            -d '{"shape":"sphere","params":{"radius":0.5},"resolution":12}')
          echo "$RESULT" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['splat_count']>0, d"

      - name: Smoke /vox (sphere, size=12)
        run: |
          RESULT=$(curl -fsS -X POST http://localhost:8787/vox \
            -H 'Content-Type: application/json' \
            -d '{"shape":"sphere","params":{"radius":0.5},"size":12}')
          echo "$RESULT" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['voxel_count']>0 and d['size']==[12,12,12], d"

      - name: Stop server
        if: always()
        run: |
          if [ -n "${SERVER_PID:-}" ]; then
            kill "$SERVER_PID" 2>/dev/null || true
          fi

  # The PyO3 binding had no CI coverage (release-wheels only builds it).
  # Builds the extension with maturin and runs python/tests/smoke.py, whose
  # every assertion has a closed-form answer (unit sphere / box distances,
  # eval_batch == |p| - 1, compiled == tree, mesh vertices on the sphere with
  # outward winding and volume within 5 % of 4/3 pi, asdf / json round trips).
  python-smoke:
    name: Python binding smoke (maturin develop + analytic oracle)
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.python == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build and install the binding into a venv
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --quiet maturin numpy
          # openvdb: bake_to_vdb, which vdb_roundtrip.py requires (it fails, not skips, without it)
          maturin develop --features python,openvdb

      - name: Run the analytic smoke test
        run: |
          . .venv/bin/activate
          python python/tests/smoke.py

      # the ALICE-VDB bytes of bake_to_vdb: an independent parser, the identifier against the JSON
      # stamp, every distance against |p| - 1 (the script prints how many samples it compared)
      - name: Run the ALICE-VDB round trip
        run: |
          . .venv/bin/activate
          python python/tests/vdb_roundtrip.py

  wasm-build:
    name: WASM bindings build
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # rust-toolchain.toml pin (1.92.0) と action の targets 不整合回避
      - name: Ensure wasm32 target on pinned toolchain
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Build wasm
        run: cargo build --release --target wasm32-unknown-unknown --features wasm --no-default-features

      - name: Verify wasm artifact exists
        run: |
          test -f target/wasm32-unknown-unknown/release/alice_sdf.wasm
          ls -lh target/wasm32-unknown-unknown/release/alice_sdf.wasm

  threejs-typecheck:
    name: Three.js TypeScript type-check
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install deps
        working-directory: bindings/threejs
        run: |
          if [ -f package.json ]; then
            npm install --no-fund --no-audit
          else
            echo "::warning::no package.json — skipping"
            exit 0
          fi

      - name: TypeScript build
        working-directory: bindings/threejs
        run: |
          if [ -f tsconfig.json ]; then
            npx tsc --noEmit
          fi

  mobile-sample-build:
    name: Mobile sample compile (iOS + Android)
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Build iOS sample (compile-only via xcodebuild)
        working-directory: mobile/samples/ios-swiftui
        run: |
          if [ -f project.yml ] && command -v xcodegen >/dev/null 2>&1; then
            xcodegen generate
          fi
          XCPROJ=$(find . -maxdepth 1 -name "*.xcodeproj" -print -quit)
          if [ -n "$XCPROJ" ]; then
            SCHEME=$(basename "$XCPROJ" .xcodeproj)
            xcodebuild -project "$XCPROJ" \
              -scheme "$SCHEME" \
              -destination 'generic/platform=iOS Simulator' \
              -configuration Debug \
              build-for-testing \
              CODE_SIGNING_ALLOWED=NO || echo "::warning::iOS sample build failed"
          else
            echo "::warning::no .xcodeproj in mobile/samples/ios-swiftui — skipping"
          fi

      - name: Build Android sample (compile-only via gradle)
        working-directory: mobile/samples/android-compose
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon || echo "::warning::Android sample build skipped (gradlew failed)"
          else
            echo "::warning::no gradlew in mobile/samples/android-compose — skipping"
          fi
