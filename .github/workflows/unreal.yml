name: Unreal

# BuildPlugin は 35-50 分かかる。ci.yml と同じ concurrency group に居ると、
# **doc だけの push でも** cancel-in-progress で完走前に消え、しかも新 run は
# paths-filter がこの job を skip するので検証が一切進まない。2026-09-27 にこれを
# 2 回起きた (1 回目は CHANGELOG の 1 行訂正、2 回目は
# `ci: node20 → node24`)。group を分けたので ci.yml 側の push はこの run を消さない。
#
# 実体は UAT BuildPlugin (editor + game targets)、editor が compile する全 .usf /
# .ush、automation 2 本 (AliceSDF.Unreal.FfiCorpusParity = alice_sdf.dll 越しの
# bit-exact、AliceSDF.Unreal.HlslGpuOracle = 転写した HLSL を DX12 で実行して DLL と
# 突合 — この crate で唯一の HLSL 実行 oracle)。GitHub-hosted runner に Unreal は
# 無いので、label `ue5` の self-hosted Windows runner で走る (E:\UE_5.x、RTX GPU、
# D3D12 のため interactive session)。repository variable UE5_RUNNER=true で gate し、
# runner 不在なら queue に積まず skip。fork PR では走らせない (self-hosted + public)。
# engine root は UE5_ENGINE_ROOTS (JSON list) から。

# paths は push / pull_request で同じ集合を **展開して** 書いている。YAML anchor
# (&x / *x) は GitHub Actions の parser では動く報告があるものの公式に保証されて
# おらず、効かなかった時に気付けるのが PR を作った時だけになるため。
on:
  push:
    # no paths here: a branch created at a SHA another ref already has gets an empty
    # diff from GitHub's filter and the run is skipped; the changes job below compares
    # with merge-base(origin/main) instead (patterns: .github/paths/unreal.txt)
    # ci/**: the owner's ci/ commits run here before they land (user decision); the
    # changes job and its policy step decide, the job's own `if:` repeats the guard
    branches: [main, 'ci/**']
  # 今日のように engine を入れ直した後で「commit を作らずに検証だけしたい」場合の入口
  # no workflow_dispatch: a job on the self-hosted host may start only from a
  # reviewed push to main (path-filtered), not from a manual run; a manual run
  # needs an environment with required reviewers first

# main では走行中の run を打ち切らない UE 5.7 と 5.8 を 1 台の runner で直列に回すと
# 約 100 分かかり、push の間隔がそれより短いと 5.8 が毎回途中で消えて一度も完走しなかった
# (2026-10-07 実測: 5.7 success の後に 5.8 が cancelled、が 5 回続いた) 打ち切らなくても
# 同じ group で待っている run は新しい push の run に置き換わるので、溜まるのは最大 1 本
# concurrency: single self-hosted runner: one UE5 machine runs 5.7 and 5.8 in about 100 minutes, a group per commit would queue every push on it
concurrency:
  group: unreal-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # which files changed: a new or force-pushed branch is compared with merge-base(origin/main),
  # another push with before..after, a pull request with base...head; schedule and manual
  # runs always run; any error runs (fail-closed) — scripts/changed_paths.py
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.policy.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after || github.sha }}
          CREATED: ${{ github.event.created }}
          FORCED: ${{ github.event.forced }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/changed_paths.py decide --event "$EVENT"
          --before "$BEFORE" --after "$AFTER" --created "$CREATED" --forced "$FORCED"
          --base "$PR_BASE" --head "$PR_HEAD"
          --patterns-file .github/paths/unreal.txt
      # the self-hosted host runs only the owner's pushes in this repository (user decision);
      # a skip by policy is run=false, so the gate expects the job skipped
      - name: policy
        id: policy
        env:
          DECIDED: ${{ steps.decide.outputs.run }}
          ALLOWED: ${{ github.repository == 'ext-sakamoro/ALICE-SDF' && github.actor == 'ext-sakamoro' && github.triggering_actor == 'ext-sakamoro' && vars.UE5_RUNNER == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          if [ "$DECIDED" = true ] && [ "$ALLOWED" = true ]; then run=true; else run=false; fi
          echo "decided=$DECIDED allowed=$ALLOWED run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  unreal-ue5:
    # the name carries the engine version, not its install path (the job log is public)
    name: Unreal Engine — BuildPlugin + automation (${{ contains(matrix.engine, '5.8') && 'UE 5.8' || contains(matrix.engine, '5.7') && 'UE 5.7' || format('engine {0}', strategy.job-index) }})
    needs: changes
    if: needs.changes.outputs.run == 'true' && github.repository == 'ext-sakamoro/ALICE-SDF' && github.actor == 'ext-sakamoro' && github.triggering_actor == 'ext-sakamoro' && vars.UE5_RUNNER == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJSON(vars.UE5_ENGINE_ROOTS || '["E:\\UE_5.7"]') }}
    runs-on: [self-hosted, windows, ue5]
    timeout-minutes: 90
    env:
      # ASCII, short: UE / UBT and the editor's DDC choke on the non-ASCII
      # user profile path; E:\ is the engine drive.
      CARGO_TARGET_DIR: E:\alice-ci\target-sdf
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5
      - name: BuildPlugin + shaders + automation tests
        shell: pwsh
        # everything the script prints goes through Protect-CiLine (scripts/ci-log-sanitize.psm1):
        # the job log is public, and UAT / the editor print drive paths, the profile directory
        # and the install roots
        run: |
          Import-Module ./scripts/ci-log-sanitize.psm1
          pwsh -NoProfile -File scripts/unreal-ue5-ci.ps1 -EngineRoot "${{ matrix.engine }}" -WorkDir "E:\alice-ci\ue5-${{ github.run_id }}" 2>&1 | ForEach-Object { Protect-CiLine "$_" }
          exit $LASTEXITCODE
      # the editor / UAT logs name the machine, so they are not uploaded: they stay on the runner
      # for 14 days (E:\alice-ci-logs\<run>-<attempt>\ue5-<index>) and the job log gets a
      # sanitized summary (scripts/ci-log-retain.ps1)
      - name: Keep logs on the runner + sanitized summary
        if: always()
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ci-log-retain.ps1 -Path "E:\alice-ci\ue5-${{ github.run_id }}\logs" -Root "E:\alice-ci-logs" -Run "${{ github.run_id }}-${{ github.run_attempt }}" -Job "ue5-${{ strategy.job-index }}"
      - name: Clean work dir
        if: always()
        shell: pwsh
        run: if (Test-Path "E:\alice-ci\ue5-${{ github.run_id }}") { Remove-Item -Recurse -Force "E:\alice-ci\ue5-${{ github.run_id }}" }

  # red when the changes job said run and a job was skipped, cancelled or failed
  gate:
    name: Gate
    if: always()
    needs: [changes, unreal-ue5]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/changed_paths.py gate --needs-json "$NEEDS"
