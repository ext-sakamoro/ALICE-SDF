# The Unity side of unity-sdf-universe — the demo has no committed .unity
# scene (it is source you assemble yourself, see unity-sdf-universe/README.md)
# and was never wired into CI, so its copy of bindings/AliceSdf.cs silently
# drifted behind the crate for a long time (found and fixed 2026-09-28).
# This job builds the native library fresh from source, drops it into the
# project, and runs Assets/Editor/CiSmokeTest.cs — a reflection-driven smoke
# test that calls SdfWorld/SdfParticleSystem's Awake/Start/Update manually
# (Unity does not call them without a scene or play mode) to exercise the
# native FFI batch-eval path and the physics integrator, not just compile.
#
# Runner: the same self-hosted Windows box as unity-vrchat.yml (label
# `unity`), which already has a licensed Unity 2022.3.22f1 — this project's
# own minimum ("2022.3+", see SETUP_GUIDE.md) — and, per unreal.yml, a working
# Rust toolchain.
#
# The repository is public and the runner is a personal machine, so this
# workflow never runs for pull requests (a fork PR could otherwise execute
# arbitrary code here). Push to main and manual dispatch only.
name: Unity (unity-sdf-universe)

on:
  push:
    # no paths here: a branch created at a SHA another ref already has gets an empty
    # diff from GitHub's filter and the run is skipped; the changes job below compares
    # with merge-base(origin/main) instead (patterns: .github/paths/unity-sdf-universe.txt)
    # ci/**: the owner's ci/ commits run here before they land (user decision); the
    # changes job and its policy step decide, the job's own `if:` repeats the guard
    branches: [main, 'ci/**']
  # no workflow_dispatch: a job on the self-hosted host may start only from a
  # reviewed push to main (path-filtered), not from a manual run; a manual run
  # needs an environment with required reviewers first

# concurrency: single self-hosted runner: one Unity editor machine, so a group per
# commit would queue every push on it; one group per ref keeps at most one pending
# run (the latest main commit always runs, an older pending one may be superseded)
# and a run on main is never cancelled
concurrency:
  group: unity-sdf-universe-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: pwsh

jobs:
  # which files changed: a new or force-pushed branch is compared with merge-base(origin/main),
  # another push with before..after, a pull request with base...head; schedule and manual
  # runs always run; any error runs (fail-closed) — scripts/changed_paths.py
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.policy.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after || github.sha }}
          CREATED: ${{ github.event.created }}
          FORCED: ${{ github.event.forced }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/changed_paths.py decide --event "$EVENT"
          --before "$BEFORE" --after "$AFTER" --created "$CREATED" --forced "$FORCED"
          --base "$PR_BASE" --head "$PR_HEAD"
          --patterns-file .github/paths/unity-sdf-universe.txt
      # the self-hosted host runs only the owner's pushes in this repository (user decision);
      # a skip by policy is run=false, so the gate expects the job skipped
      - name: policy
        id: policy
        env:
          DECIDED: ${{ steps.decide.outputs.run }}
          ALLOWED: ${{ github.repository == 'ext-sakamoro/ALICE-SDF' && github.actor == 'ext-sakamoro' && github.triggering_actor == 'ext-sakamoro' }}
        run: |
          if [ "$DECIDED" = true ] && [ "$ALLOWED" = true ]; then run=true; else run=false; fi
          echo "decided=$DECIDED allowed=$ALLOWED run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  unity-sdf-universe:
    name: Unity 2022.3.22f1 — compile + native FFI smoke test
    needs: changes
    if: needs.changes.outputs.run == 'true' && github.repository == 'ext-sakamoro/ALICE-SDF' && github.actor == 'ext-sakamoro' && github.triggering_actor == 'ext-sakamoro'
    runs-on: [self-hosted, windows, unity]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Unity 2022.3.22f1
        id: unity
        run: |
          $unity = "E:\2022.3.22f1\Editor\Unity.exe"
          if (-not (Test-Path $unity)) {
            Write-Host "::error title=Unity missing::$unity not found on this runner"
            exit 1
          }
          "path=$unity" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          (Get-Item $unity).VersionInfo.ProductVersion

      - name: cargo build --release --features unity
        run: |
          cargo build --release --features unity
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Place native library (Assets/Plugins/alice_sdf.dll)
        run: |
          New-Item -ItemType Directory -Force -Path unity-sdf-universe\Assets\Plugins | Out-Null
          Copy-Item target\release\alice_sdf.dll unity-sdf-universe\Assets\Plugins\alice_sdf.dll -Force

      - name: Compile + CiSmokeTest (native FFI batch eval + physics step)
        run: |
          $log = "unity-sdf-universe-ci.log"
          $unityArgs = @("-batchmode", "-nographics", "-quit", "-projectPath", "unity-sdf-universe",
                         "-executeMethod", "CiSmokeTest.Run", "-logFile", $log)
          # Start-Process -Wait, not `&`: Unity.exe is a GUI-subsystem process, and
          # scripts/unity-preflight.ps1 uses the same pattern on this runner for the
          # same reason — `&` can return before the process actually exits, which
          # otherwise races the Get-Content below against Unity still starting up.
          $p = Start-Process -FilePath "${{ steps.unity.outputs.path }}" -ArgumentList $unityArgs -NoNewWindow -PassThru -Wait
          $exit = $p.ExitCode
          if (-not (Test-Path $log)) {
            Write-Host "::error title=unity-sdf-universe::$log was never created (Unity exited $exit before writing it)"
            exit 1
          }
          Get-Content $log | Select-String -Pattern "\[CiSmokeTest\]|error CS|Exception"
          if ($exit -ne 0) {
            Write-Host "::error title=unity-sdf-universe::CiSmokeTest exited $exit — see uploaded log"
            exit $exit
          }

      - name: Unity log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unity-sdf-universe-log
          path: unity-sdf-universe-ci.log
          if-no-files-found: ignore

  # red when the changes job said run and a job was skipped, cancelled or failed
  gate:
    name: Gate
    if: always()
    needs: [changes, unity-sdf-universe]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/changed_paths.py gate --needs-json "$NEEDS"
