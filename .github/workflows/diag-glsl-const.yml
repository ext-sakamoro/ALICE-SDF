name: Diagnostic GLSL const form on lavapipe
on:
  push:
    branches: ['diag/**']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  const-form:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ALICE_SDF_REQUIRE_GPU: "1"
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Mesa software Vulkan (lavapipe)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools
          icd=$(find /usr/share/vulkan/icd.d -name "lvp_icd*.json" | head -1)
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$icd" vulkaninfo --summary | tee /tmp/vulkaninfo.txt | head -40
          grep -qi llvmpipe /tmp/vulkaninfo.txt
      - name: The const GLSL form per case, one process each, 900 s cap
        shell: bash
        run: |
          set -uo pipefail
          cargo test --no-run --features "gpu,glsl" --test zz_diag_glsl_const
          n=0
          for c in loft-2-4:variable polygon-1:const section-stack-3:const loft-2-4:const; do
            echo "CASE start $c"
            start=$(date +%s)
            DIAG_CASE=$c timeout 900 python3 scripts/peak_rss.py --max-mib 6000 --what "case $c" -- cargo test --features "gpu,glsl" --test zz_diag_glsl_const one_case -- --ignored --exact --nocapture 2>&1 | grep -E "CASE|peak-rss|panicked|BufferMapping" | cut -c1-300
            rc=${PIPESTATUS[0]}
            echo "CASE end $c rc=$rc wall $(( $(date +%s) - start )) s"
          done | tee diag.log
          n=$(grep -c "CASE done" diag.log || true)
          echo "measured cases: $n"
          [ "$n" -gt 0 ]
