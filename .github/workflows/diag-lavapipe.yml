name: Diagnostic lavapipe large dispatch
on:
  push:
    branches: ['diag/**']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  large-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ALICE_SDF_REQUIRE_GPU: "1"
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Mesa software Vulkan (lavapipe)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools
          icd=$(find /usr/share/vulkan/icd.d -name "lvp_icd*.json" | head -1)
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$icd" vulkaninfo --summary | tee /tmp/vulkaninfo.txt | head -40
          grep -qi llvmpipe /tmp/vulkaninfo.txt
      - name: Large dispatches, one test alone
        continue-on-error: true
        run: cargo test --features "gpu,glsl,gpu-mesh,texture-fit" --test test_glsl_large_dispatch_diag -- --nocapture --test-threads=1
      - name: The parity test as CI runs it
        continue-on-error: true
        run: cargo test --features "gpu,glsl,gpu-mesh,texture-fit" --test test_gpu_law_parity -- --nocapture
