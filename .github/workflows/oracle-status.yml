name: Oracle Status

on:
  push:
    # no paths here: a branch created at a SHA another ref already has gets an empty
    # diff from GitHub's filter and the run is skipped; the changes job below compares
    # with merge-base(origin/main) instead (patterns: .github/paths/oracle-status.txt)
    # ci/**: a gate that decides whether a commit may land runs before it lands
    branches: [main, 'ci/**']
  # runs on a ci/** sha by hand (gh workflow run --ref <branch>) before it lands
  workflow_dispatch:

permissions:
  contents: read

# The ledger is regenerated and committed together with the change that moves it;
# this workflow only checks that the committed copy matches the tree. It does not
# commit: a commit made here would be authored by a bot account.
# One group per workflow; a newer push cancels the older run of the same workflow.
# on main each commit has a group of its own and a run there is never
# cancelled; a newer push cancels an older run only off main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # which files changed: a new or force-pushed branch is compared with merge-base(origin/main),
  # another push with before..after, a pull request with base...head; schedule and manual
  # runs always run; any error runs (fail-closed) — scripts/changed_paths.py
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after || github.sha }}
          CREATED: ${{ github.event.created }}
          FORCED: ${{ github.event.forced }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/changed_paths.py decide --event "$EVENT"
          --before "$BEFORE" --after "$AFTER" --created "$CREATED" --forced "$FORCED"
          --base "$PR_BASE" --head "$PR_HEAD"
          --patterns-file .github/paths/oracle-status.txt

  check-oracle-status:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Check docs/oracle-status.md is up to date
        run: |
          python3 scripts/gen-oracle-status.py
          if ! git diff --exit-code docs/oracle-status.md; then
            echo "::error::docs/oracle-status.md is stale: run 'python3 scripts/gen-oracle-status.py' and commit the result with the change"
            exit 1
          fi

  # red when the changes job said run and a job was skipped, cancelled or failed
  gate:
    name: Gate
    if: always()
    needs: [changes, check-oracle-status]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/changed_paths.py gate --needs-json "$NEEDS"
