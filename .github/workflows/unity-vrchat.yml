# The Unity side of vrchat-package — what the Rust and dotnet jobs of ci.yml
# cannot see: do the shaders compile (Standalone + Android GLES3), do the
# scripts and UdonSharp programs compile, do the seven sample scenes come out
# with a descriptor / spawn / backing UdonBehaviour, does the Kit product build
# and export with every prefab / program / shader / texture. The stages live in
# vrchat-package/Editor/AliceSDF_CiChecks.cs and are driven by
# scripts/unity-preflight.ps1 — the same script a developer runs before a push.
#
# Runner: self-hosted Windows with Unity 2022.3.22f1 installed and its licence
# activated (label `unity`). GitHub-hosted runners cannot do this any more:
# Unity dropped offline activation for Personal seats, so a .ulf cannot be
# obtained at all, and the credential path (Unity.Licensing.Client
# --include-personal) would put the account password in a secret and leaks a
# seat when a run is cancelled. The machine's own licence has neither problem.
#
# The repository is public and the runner is a personal machine, so this
# workflow never runs for pull requests (a fork PR could otherwise execute
# arbitrary code here). Push to main and manual dispatch only; a PR's Unity
# state is checked by the author running scripts/unity-preflight.ps1.
name: Unity (VRChat)

on:
  push:
    # no paths here: a branch created at a SHA another ref already has gets an empty
    # diff from GitHub's filter and the run is skipped; the changes job below compares
    # with merge-base(origin/main) instead (patterns: .github/paths/unity-vrchat.txt)
    # ci/**: the owner's ci/ commits run here before they land (user decision); the
    # changes job and its policy step decide, the job's own `if:` repeats the guard
    branches: [main, 'ci/**']
  # no workflow_dispatch: a job on the self-hosted host may start only from a
  # reviewed push to main (path-filtered), not from a manual run; a manual run
  # needs an environment with required reviewers first

# concurrency: single self-hosted runner: one Unity editor machine, so a group per
# commit would queue every push on it; one group per ref keeps at most one pending
# run (the latest main commit always runs, an older pending one may be superseded)
# and a run on main is never cancelled
concurrency:
  group: unity-vrchat-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    # Not `powershell` (Windows PowerShell): its script execution policy on
    # this runner is intermittently Restricted, which fails GitHub Actions'
    # auto-generated temp .ps1 wrapper before a single step body runs
    # ("cannot be loaded because running scripts is disabled on this
    # system", PSSecurityException: UnauthorizedAccess — hit runs
    # 2026-09-25 and 2026-09-28, found while adding unity-sdf-universe.yml). unreal.yml
    # uses pwsh on the same runner without this problem.
    shell: pwsh

jobs:
  # which files changed: a new or force-pushed branch is compared with merge-base(origin/main),
  # another push with before..after, a pull request with base...head; schedule and manual
  # runs always run; any error runs (fail-closed) — scripts/changed_paths.py
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    # the workflow's default shell is pwsh (for the self-hosted Windows job); these steps are bash
    defaults:
      run:
        shell: bash
    timeout-minutes: 5
    outputs:
      run: ${{ steps.policy.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after || github.sha }}
          CREATED: ${{ github.event.created }}
          FORCED: ${{ github.event.forced }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/changed_paths.py decide --event "$EVENT"
          --before "$BEFORE" --after "$AFTER" --created "$CREATED" --forced "$FORCED"
          --base "$PR_BASE" --head "$PR_HEAD"
          --patterns-file .github/paths/unity-vrchat.txt
      # the self-hosted host runs only the owner's pushes in this repository (user decision);
      # a skip by policy is run=false, so the gate expects the job skipped
      - name: policy
        id: policy
        env:
          DECIDED: ${{ steps.decide.outputs.run }}
          ALLOWED: ${{ github.repository == 'ext-sakamoro/ALICE-SDF' && github.actor == 'ext-sakamoro' && github.triggering_actor == 'ext-sakamoro' }}
        run: |
          if [ "$DECIDED" = true ] && [ "$ALLOWED" = true ]; then run=true; else run=false; fi
          echo "decided=$DECIDED allowed=$ALLOWED run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  unity-vrchat:
    name: Unity 2022.3.22f1 — shaders / UdonSharp / scenes / Kit (PC + Android)
    needs: changes
    if: needs.changes.outputs.run == 'true' && github.repository == 'ext-sakamoro/ALICE-SDF' && github.actor == 'ext-sakamoro' && github.triggering_actor == 'ext-sakamoro'
    runs-on: [self-hosted, windows, unity]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      # The editor is the machine's, not a container's: fail with a clear
      # message instead of a missing-file error deep inside the stages
      - name: Unity 2022.3.22f1
        id: unity
        run: |
          $unity = "E:\2022.3.22f1\Editor\Unity.exe"
          if (-not (Test-Path $unity)) {
            Write-Host "::error title=Unity missing::$unity not found on this runner; install 2022.3.22f1 or point the workflow at the installed editor"
            exit 1
          }
          "path=$unity" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          # not `& $unity -version`: Unity prints the version and exits 1, and a
          # PowerShell step fails on a non-zero last exit code
          (Get-Item $unity).VersionInfo.ProductVersion

      - name: VRChat Worlds project (vrc-get, com.alice.sdf file link)
        run: pwsh -NoProfile -File scripts/unity-ci-project.ps1 -Project ci-unity

      # setup / compile / samples / scenes / kit (looped over its domain
      # reloads) / verify / android. -SkipDrift: the project is created from
      # CI~ here, so there are no developer Assets/Samples copies to compare.
      - name: Unity stages (setup, compile, samples, scenes, kit, verify, android)
        run: pwsh -NoProfile -File scripts/unity-preflight.ps1 -Project "$env:GITHUB_WORKSPACE\ci-unity" -Unity "${{ steps.unity.outputs.path }}" -SkipDrift

      - name: Kit unitypackage
        uses: actions/upload-artifact@v6
        with:
          name: AliceSDFKit-unitypackage
          path: vrchat-package/Product~/*.unitypackage
          if-no-files-found: error

      - name: Unity logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unity-logs
          path: target/unity-preflight/*.log
          if-no-files-found: ignore

  # red when the changes job said run and a job was skipped, cancelled or failed
  gate:
    name: Gate
    if: always()
    needs: [changes, unity-vrchat]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/changed_paths.py gate --needs-json "$NEEDS"
