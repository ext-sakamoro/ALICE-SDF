name: Security & Hygiene

# 目的:
# - RustSec advisory (CVE) の週次検知
# - dep license 逸脱 (GPL 侵入等) の block
# - 未使用依存の炙り出し (menso bloat 予防)
# - 仮実装 (todo! / unimplemented! / panic!(STUB) / dbg!) の CI gate
#
# main-CI (ci.yml) は build / test / clippy / doc に集中させ、本 workflow は
# セキュリティと衛生に特化 push + PR + 週次 cron の 3 trigger

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'deny.toml'
      - 'scripts/**'
      - '.github/workflows/security-audit.yml'
      - '.github/actions/**'
      - 'examples/*/Cargo.toml'
      - 'bindings/*/Cargo.toml'
      - 'bindings/*/*/Cargo.toml'
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'deny.toml'
      - 'scripts/**'
      - '.github/workflows/security-audit.yml'
      - '.github/actions/**'
      - 'examples/*/Cargo.toml'
      - 'bindings/*/Cargo.toml'
      - 'bindings/*/*/Cargo.toml'
  schedule:
    # 毎週月曜 09:00 UTC = 18:00 JST
    # commit 間で新規公表された CVE を weekly で catch
    - cron: '0 9 * * 1'
  workflow_dispatch:  # 手動 kick 可

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "5"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  audit:
    name: cargo audit (RustSec CVE scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # advisory-db は audit 実行時に自動取得
      # yanked crate は deny (--deny yanked)、unmaintained warning は個別 ignore で管理
      # 現在の ignore 対象:
      # - RUSTSEC-2025-0141: bincode 2.x unmaintained (代替 postcard は wire format 別、移行コスト高)
      # - RUSTSEC-2024-0436: paste 1.0.15 unmaintained (pyo3-macros 経由 transitive、除去不能)
      - name: Run cargo audit
        run: |
          cargo audit \
            --deny yanked \
            --ignore RUSTSEC-2025-0141 \
            --ignore RUSTSEC-2024-0436

  deny:
    name: cargo-deny (license + advisories + bans + sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # EmbarkStudios/cargo-deny-action@v2 は Docker container 内で稼働し、
      # /github/workspace のみ mount する制約を避けるため直接 install (path dep は 1.12.0 で消滅)
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      - name: Run cargo deny check all
        run: cargo deny --all-features check all

  unused-deps:
    name: cargo-machete (unused dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      # machete は Cargo.toml 静的解析、feature-gated 未使用 dep も検知
      # false-positive は各 Cargo.toml の [package.metadata.cargo-machete] ignored = [...] で除外
      # 現状の ignored: log / js-sys / vdb-rs (feature-gated 予備 dep、将来使用予定)
      - uses: bnjbvr/cargo-machete@main

  package-integrity:
    name: Package integrity (publish される .crate が build できるか)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      # publish される .crate に必要な file が全部入っているかを見る
      #
      # include_str! / include_bytes! が package 境界を越える、exclude を効かせ過ぎる、
      # 必要 file が漏れる — これらは repo / workspace に file がある限り
      # cargo build も cargo test も clippy も preflight も全部通り、
      # crates.io から取得した利用者だけが compile 不能になる
      # (2026-09-28 ALICE-LOL lol.gbnf、canonical template 罠 #51)
      #
      # semver-checks は baseline を build するので結果的に検出するが、
      # (a) 壊れた版を publish した後にしか分からない
      # (b) 未 publish crate は baseline が無く発火しない ので予防にならない
      - name: cargo package (.crate を作る)
        # --no-verify: 未 publish の sibling に path dep がある repo では verify step が
        #   registry 解決で落ちる 展開後の隔離 build が本体なので verify は不要
        run: cargo package --no-verify --allow-dirty

      - name: 展開して隔離 build
        run: |
          set -euo pipefail
          crate=$(find target/package -maxdepth 1 -name '*.crate' | head -1)
          [ -n "$crate" ] || { echo "::error::.crate が生成されていない"; exit 1; }
          echo "packaged: $(basename "$crate") ($(du -h "$crate" | cut -f1))"
          tmp=$(mktemp -d)
          tar xzf "$crate" -C "$tmp"
          cd "$tmp"/*/
          # 親 workspace を継承すると member 扱いになり、境界を越えた file が
          # 再び見えてしまう (検査の意味が消える) ので単独 package として build
          printf '\n[workspace]\n' >> Cargo.toml
          cargo check --all-features

  coverage:
    name: Coverage (cargo-llvm-cov、informational)
    runs-on: ubuntu-latest
    # Informational by design (not a test gate): coverage is a number to
    # watch, no threshold is enforced. `alice-strict-eval` 16 counts only
    # test / build steps.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # --lib のみ (test の doctest / integration test は clippy / test job で担保)
      # --summary-only で行 coverage % + region coverage % を PR log に表示
      # set -o pipefail: `| tee` / `| tail` が cargo の exit code を mask して
      # build error を green 偽装する (canonical 罠 #22)
      - name: Run coverage
        run: |
          set -o pipefail
          cargo llvm-cov --lib --summary-only --workspace \
            --no-default-features 2>&1 | tee coverage-summary.txt
          echo ""
          echo "=== Coverage summary (default features) ==="
          cargo llvm-cov --lib --summary-only 2>&1 | tail -20

      - name: Upload coverage summary as artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage-summary
          path: coverage-summary.txt
          retention-days: 30

  semver-checks:
    name: cargo-semver-checks (API compat vs crates.io、informational)
    runs-on: ubuntu-latest
    # Hard gate since 1.12.0: the bridge features are back on crates.io deps
    # (a planned major bump was the reason this was informational). A real
    # breaking change must come with a major bump and an explicit
    # `--baseline-version` decision, not a red job that nobody reads.
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # version 明示 pin: `@latest` は rustc MSRV を追いかける (0.50.0 = 1.93+) ので、
      # rust-toolchain.toml の pin が遅れると赤になる (2026-09-14 事案) toolchain と
      # 一緒に月次で bump する
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@0.50.0

      # check-release: 最新 crates.io publish 版と HEAD の API 差分を検出
      # --baseline-version で明示指定も可 (現状は自動: 最新 published)
      #
      # feature 集合は cargo metadata から動的に取り、以下を除外する:
      #   font   — 1.9.0 (baseline) では alice_font 未宣言のまま module を gate していて
      #            rustdoc 不能 (1.9.1 で cfg flag gate に修正済) 1.9.1 publish 後に除外解除可
      #   godot  — 1.9.0 では存在しない transpile_glsl を呼んでいて rustdoc 不能 (1.9.1 で修正済)、同上
      #   python — PyO3 は rustdoc では不要だが CI runner の Python 依存を避ける
      # 除外なし (= 全 feature) だと baseline 側の build で落ちて HEAD の API 検査に到達しない
      - name: Run cargo semver-checks
        run: |
          feats=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name=="alice-sdf") | .features | keys[]' \
            | grep -vE '^(default|font|godot|python)$' | paste -sd, -)
          echo "features: $feats"
          # This run compares NOTHING during a major bump, and exits 0 while
          # doing it. cargo-semver-checks selects lints by "is the bump this
          # lint requires already satisfied", so once Cargo.toml is a major
          # ahead of crates.io every lint is unnecessary:
          #
          #   Checking alice-sdf v3.1.1 -> v4.0.0 (major change)
          #   Starting 0 checks, 254 unnecessary on 8 threads
          #    Summary no semver update required      <- exit 0, 0 comparisons
          #
          # 2026-09-30: 4.0.0 reached the point of publication with 102 breaking
          # items (98 shifted enum discriminants, 2 newly non_exhaustive enums,
          # 2 added struct fields) never enumerated, and 4 of them missing from
          # CHANGELOG. So the number of checks that ran is read back, and only
          # when it is 0 (or unreadable) does the second pass run.
          # `--release-type patch` forces the major and minor lint families
          # (223 checks on 4.0.0); exit 100 there is the expected outcome of a
          # genuinely breaking release — that is the enumeration, not a failure
          # — so the hard gate is "a nonzero number of checks ran", the one
          # thing a green run cannot fake.
          set +e
          cargo semver-checks check-release --package alice-sdf \
            --only-explicit-features --features "$feats" 2>&1 | tee semver.log
          rc=${PIPESTATUS[0]}
          set -e
          ran=$(grep -oE '[0-9]+ checks: ' semver.log | grep -oE '[0-9]+' | tail -1 || true)
          if [ "$rc" -ne 0 ]; then echo "::error::semver-checks failed (rc=$rc)"; exit "$rc"; fi
          if [ -z "${ran:-}" ] || [ "$ran" -eq 0 ]; then
            echo "first pass compared ${ran:-no} checks — enumerating with --release-type patch"
            cargo semver-checks check-release --package alice-sdf --only-explicit-features --features "$feats" --release-type patch 2>&1 | tee semver.log || true
            ran=$(grep -oE '[0-9]+ checks: ' semver.log | grep -oE '[0-9]+' | tail -1 || true)
            if [ -z "${ran:-}" ] || [ "$ran" -eq 0 ]; then echo "::error::semver-checks ran ${ran:-no} checks in both passes — the gate compared nothing"; exit 1; fi
          fi
          echo "semver-checks compared $ran checks"

  stub-guard:
    name: Stub / mock / dbg guard (grep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # CLAUDE.md「仮実装完了偽装の禁止ルール」準拠
      # src/ 配下の production path に todo! / unimplemented! / panic!(STUB) が
      # 混入していないか grep で block src/bin/ は CLI 意図的 panic 許容のため除外
      - name: Detect todo! / unimplemented! / panic!(STUB) in src/**
        run: |
          set -eo pipefail
          # test 除外: #[cfg(test)] / mod tests { で囲まれた block は grep で拾うが
          # 実際に todo!() が本 repo で src/ に混入した過去がないため厳格 block
          # STUB (uppercase) 明示のみ検出 (2026-09-03 refine)
          # trait default method の `panic!("... not implemented by this backend")` 等は
          # legitimate な pattern で stub ではない (ALICE-Physics 展開時発覚)
          hits=$(grep -rnE 'todo!\(|unimplemented!\(|panic!\([^)]*STUB' \
            src/ --include="*.rs" \
            --exclude-dir=bin \
            || true)
          if [ -n "$hits" ]; then
            echo "❌ Stub / unimplemented / STUB panic detected in src/ (production path):"
            echo "$hits"
            echo ""
            echo "Fix: use ? operator, Result<T, E>, or remove the stub."
            echo "  See CLAUDE.md § 仮実装完了偽装の禁止ルール"
            exit 1
          fi
          echo "✓ No todo! / unimplemented! / panic!(STUB) in src/ (excluding src/bin/)"

      # 3.1.0: the evaluator and the laws are cross-platform bit-exact through
      # alice-det-math; a platform libm call (`x.sin()`) or a fused `mul_add`
      # anywhere in these directories silently reintroduces per-target bits.
      # Test modules (after `#[cfg(test)] mod`) may call libm as the reference.
      # The remaining directories (npr / mesh / texture / gi / io / terrain)
      # move over in 3.2.0.
      - name: Detect platform libm / mul_add in the evaluator and law directories
        run: |
          set -eo pipefail
          python3 scripts/det_math_guard.py

      # 4.0.1: interval arithmetic is only a valid enclosure because every
      # computed bound goes through `Interval::new` / `Interval::outward`, which
      # round outward by one ulp. A raw `Interval { lo, hi }` literal skips that
      # silently, and the inclusion oracle cannot see it (it samples points, so
      # an enclosure one ulp too narrow at an unsampled corner still reads
      # 0.000e0). Selection-only and exact-by-construction sites carry a written
      # `ALLOW-RAW-INTERVAL:` reason.
      - name: Detect raw Interval literals bypassing the outward rounding
        run: |
          set -eo pipefail
          python3 scripts/interval_outward_guard.py

      - name: Detect dbg!() residual in src/**
        run: |
          set -eo pipefail
          hits=$(grep -rn 'dbg!(' src/ --include="*.rs" || true)
          if [ -n "$hits" ]; then
            echo "❌ dbg!() macro left in src/:"
            echo "$hits"
            echo ""
            echo "Fix: remove dbg!() before merging (debug residual)."
            exit 1
          fi
          echo "✓ No dbg!() in src/"

      # TODO/FIXME/XXX/HACK は informational (block しない)
      # PR reviewer が判断するための可視化のみ
      - name: Detect TODO / FIXME / XXX / HACK (informational)
        run: |
          set -eo pipefail
          hits=$(grep -rnE 'TODO|FIXME|XXX|HACK' src/ --include="*.rs" || true)
          if [ -n "$hits" ]; then
            echo "::warning::TODO/FIXME/XXX/HACK found in src/ (informational, not blocking):"
            echo "$hits" | head -50
          else
            echo "✓ No TODO/FIXME/XXX/HACK in src/"
          fi
