name: Security & Hygiene

# 目的:
# - RustSec advisory (CVE) の週次検知
# - dep license 逸脱 (GPL 侵入等) の block
# - 未使用依存の炙り出し (menso bloat 予防)
# - 仮実装 (todo! / unimplemented! / panic!(STUB) / dbg!) の CI gate
#
# main-CI (ci.yml) は build / test / clippy / doc に集中させ、本 workflow は
# セキュリティと衛生に特化 push + PR + 週次 cron の 3 trigger

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'deny.toml'
      - '.github/workflows/security-audit.yml'
      - '.github/actions/**'
      - 'examples/*/Cargo.toml'
      - 'bindings/*/Cargo.toml'
      - 'bindings/*/*/Cargo.toml'
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'deny.toml'
      - '.github/workflows/security-audit.yml'
      - '.github/actions/**'
      - 'examples/*/Cargo.toml'
      - 'bindings/*/Cargo.toml'
      - 'bindings/*/*/Cargo.toml'
  schedule:
    # 毎週月曜 09:00 UTC = 18:00 JST
    # commit 間で新規公表された CVE を weekly で catch
    - cron: '0 9 * * 1'
  workflow_dispatch:  # 手動 kick 可

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "5"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  audit:
    name: cargo audit (RustSec CVE scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Create ALICE optional bridge stubs
        uses: ./.github/actions/alice-stubs

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # advisory-db は audit 実行時に自動取得
      # yanked crate は deny (--deny yanked)、unmaintained warning は個別 ignore で管理
      # 現在の ignore 対象:
      # - RUSTSEC-2025-0141: bincode 2.x unmaintained (代替 postcard は wire format 別、移行コスト高)
      # - RUSTSEC-2024-0436: paste 1.0.15 unmaintained (pyo3-macros 経由 transitive、除去不能)
      - name: Run cargo audit
        run: |
          cargo audit \
            --deny yanked \
            --ignore RUSTSEC-2025-0141 \
            --ignore RUSTSEC-2024-0436

  deny:
    name: cargo-deny (license + advisories + bans + sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Create ALICE optional bridge stubs
        uses: ./.github/actions/alice-stubs

      # EmbarkStudios/cargo-deny-action@v2 は Docker container 内で稼働し、
      # /github/workspace のみ mount するため sibling path dep (../ALICE-Physics 等) が
      # 見えず fail する 直接 install で回避 (Docker 制約回避、alice-stubs step は host 側で有効)
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      - name: Run cargo deny check all
        run: cargo deny --all-features check all

  unused-deps:
    name: cargo-machete (unused dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      # alice-stubs step 必要 (Cargo.toml の path dep 解決のため cargo metadata が動く)
      - name: Create ALICE optional bridge stubs
        uses: ./.github/actions/alice-stubs

      # machete は Cargo.toml 静的解析、feature-gated 未使用 dep も検知
      # false-positive は各 Cargo.toml の [package.metadata.cargo-machete] ignored = [...] で除外
      # 現状の ignored: log / js-sys / vdb-rs (feature-gated 予備 dep、将来使用予定)
      - uses: bnjbvr/cargo-machete@main

  coverage:
    name: Coverage (cargo-llvm-cov、informational)
    runs-on: ubuntu-latest
    # coverage は informational only、threshold で fail させない
    # 初期値把握が目的、将来的に threshold 導入判断
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2

      - name: Create ALICE optional bridge stubs
        uses: ./.github/actions/alice-stubs

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # --lib のみ (test の doctest / integration test は clippy / test job で担保)
      # --summary-only で行 coverage % + region coverage % を PR log に表示
      - name: Run coverage
        run: |
          cargo llvm-cov --lib --summary-only --workspace \
            --no-default-features 2>&1 | tee coverage-summary.txt
          echo ""
          echo "=== Coverage summary (default features) ==="
          cargo llvm-cov --lib --summary-only 2>&1 | tail -20

      - name: Upload coverage summary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage-summary.txt
          retention-days: 30

  semver-checks:
    name: cargo-semver-checks (API compat vs crates.io、informational)
    runs-on: ubuntu-latest
    # ALICE-SDF 1.8.0 で physics / font bridge 復帰予定 = 予定された major bump
    # break 検知しても block しない (informational only、user 側で version bump 判断)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Create ALICE optional bridge stubs
        uses: ./.github/actions/alice-stubs

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@cargo-semver-checks

      # check-release: 最新 crates.io publish 版と HEAD の API 差分を検出
      # --baseline-version で明示指定も可 (現状は自動: 最新 published)
      - name: Run cargo semver-checks
        run: cargo semver-checks check-release --package alice-sdf

  stub-guard:
    name: Stub / mock / dbg guard (grep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # CLAUDE.md「仮実装完了偽装の禁止ルール」準拠
      # src/ 配下の production path に todo! / unimplemented! / panic!(STUB) が
      # 混入していないか grep で block src/bin/ は CLI 意図的 panic 許容のため除外
      - name: Detect todo! / unimplemented! / panic!(STUB) in src/**
        run: |
          set -eo pipefail
          # test 除外: #[cfg(test)] / mod tests { で囲まれた block は grep で拾うが
          # 実際に todo!() が本 repo で src/ に混入した過去がないため厳格 block
          hits=$(grep -rnE 'todo!\(|unimplemented!\(|panic!\([^)]*(STUB|NOT.IMPL|not.impl)' \
            src/ --include="*.rs" \
            --exclude-dir=bin \
            || true)
          if [ -n "$hits" ]; then
            echo "❌ Stub / unimplemented / STUB panic detected in src/ (production path):"
            echo "$hits"
            echo ""
            echo "Fix: use ? operator, Result<T, E>, or remove the stub."
            echo "  See CLAUDE.md § 仮実装完了偽装の禁止ルール"
            exit 1
          fi
          echo "✓ No todo! / unimplemented! / panic!(STUB) in src/ (excluding src/bin/)"

      - name: Detect dbg!() residual in src/**
        run: |
          set -eo pipefail
          hits=$(grep -rn 'dbg!(' src/ --include="*.rs" || true)
          if [ -n "$hits" ]; then
            echo "❌ dbg!() macro left in src/:"
            echo "$hits"
            echo ""
            echo "Fix: remove dbg!() before merging (debug residual)."
            exit 1
          fi
          echo "✓ No dbg!() in src/"

      # TODO/FIXME/XXX/HACK は informational (block しない)
      # PR reviewer が判断するための可視化のみ
      - name: Detect TODO / FIXME / XXX / HACK (informational)
        run: |
          set -eo pipefail
          hits=$(grep -rnE 'TODO|FIXME|XXX|HACK' src/ --include="*.rs" || true)
          if [ -n "$hits" ]; then
            echo "::warning::TODO/FIXME/XXX/HACK found in src/ (informational, not blocking):"
            echo "$hits" | head -50
          else
            echo "✓ No TODO/FIXME/XXX/HACK in src/"
          fi
