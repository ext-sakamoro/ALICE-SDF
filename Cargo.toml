[package]
name = "alice-sdf"
version = "1.12.0"
edition = "2021"
# MSRV-aware 依存解決 (cargo 1.84+): `cargo update` が `rust-version` を超える dep を
# 選ばない = lockfile が宣言 MSRV から silent に乖離しない (1.10.3 で 1.75 宣言のまま
# clap_lex 1.1.0 (edition 2024) を掴んでいた事案の根絶、CI `msrv` job と対)
resolver = "3"
authors = ["Moroya Sakamoto <sakamoro@alicelaw.net>"]
description = "ALICE-SDF: 3D/Spatial Data Specialist — Store laws, not polygons. GLSL/WGSL/HLSL transpile, SVO, GPU marching cubes, texture-fit, procedural CSG. Optional bridges to alice-physics / alice-codec / libasp / alice-cache behind features."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ext-sakamoro/ALICE-SDF"
homepage = "https://github.com/ext-sakamoro/ALICE-SDF"
documentation = "https://docs.rs/alice-sdf"
keywords = ["sdf", "distance-field", "3d", "procedural", "csg"]
categories = ["graphics", "game-development", "mathematics"]
# 1.10.3: 1.75 は偽だった (lock の clap_lex 1.1.0 が edition2024 要求、default
# feature `cli` → clap 必須で manifest parse 段階 fail)。1.85 は default +
# docs.rs feature set で実測 check 通過、CI `msrv` job が宣言値を検証する。
rust-version = "1.85"
# crates.io publish から除外する dir / file 群
# (Rust crate 配布物として本質的に不要、別 channel で配布 or CI 内部専用)
# - vrchat-package / unreal-plugin / mobile / unity-sdf-universe: 他 engine 統合成果物
#   (それぞれ独立 distribution channel: GitHub Release / Unity Asset Store / Fab)
# - skills: Claude Code skill files (docs.rs 不要)
# - npm: Three.js npm package (npmjs.com 配布)
# - python: pyproject.toml + wheel build script (PyPI 配布)
# - .github / scripts: CI workflow / release scripts (docs.rs 不要)
# 1.7.7 で publish size を 579 → 削減して crates.io WAF による upload 503 を回避
exclude = [
    "/vrchat-package",
    "/unreal-plugin",
    "/mobile",
    "/unity-sdf-universe",
    "/skills",
    "/npm",
    "/python",
    "/.github",
    "/scripts",
    "*.mp4",
    "*.png",
    "*.jpg",
    "*.blend",
    "*.zip",
    "*.stl",
    "*.obj",
    "*.glb",
    "*.gltf",
    "Cargo.toml.orig",
]

[lib]
name = "alice_sdf"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "alice-sdf"
path = "src/bin/main.rs"

[features]
default = ["cli"]
cli = ["clap"]
texture-fit = ["image", "cli"]
python = ["pyo3", "numpy"]
godot = ["dep:godot"]  # Godot 4.x GDExtension integration
jit = ["cranelift-codegen", "cranelift-frontend", "cranelift-jit", "cranelift-module", "cranelift-native"]
gpu = ["wgpu", "pollster", "bytemuck", "futures-channel"]
volume = ["gpu"]  # 3D volume texture baking
gpu-mesh = ["gpu"]  # GPU Marching Cubes mesh generation
svo = []  # Sparse Voxel Octree
svo-gpu = ["svo", "gpu"]  # SVO with GPU support
destruction = []  # Voxel destruction system
terrain = []  # Terrain system (heightmap + erosion + caves)
gi = ["svo"]  # Cone tracing global illumination
hlsl = []  # HLSL transpiler for UE5/DirectX
glsl = []  # GLSL transpiler for Unity/OpenGL/Vulkan
blinkscript = ["hlsl"]  # BlinkScript transpiler for Foundry Nuke (delegates to HLSL body)
# Bridge features. codec / physics / asp / sdf-cache resolve to the sibling
# crates on crates.io since 1.12.0 (they were removed for the 1.7.7 publish
# while those crates were path-only). `font` stays an inert gate until
# alice-font publishes: `font_bridge` and the `text_to_3d_demo` example
# additionally require `RUSTFLAGS="--cfg alice_font_bridge"` with a local
# `alice-font` path dep (a plain `--features font` must not import an
# undeclared crate, or `--all-features` breaks for every crates.io user).
physics = ["dep:alice-physics"]  # SdfField impl + sim_modifier chain (alice-physics)
codec = ["dep:alice-codec"]  # wavelet + rANS SDF volume codec (alice-codec)
asp = ["dep:libasp"]  # ALICE Streaming Protocol packets (libasp)
sdf-cache = ["dep:alice-cache"]  # evaluation cache (alice-cache)
font = []  # Font bridge gate — inert on crates.io, see above
ffi = ["lazy_static"]  # C/C++/C# FFI bindings
wasm = ["dep:wasm-bindgen", "dep:js-sys"]  # WebAssembly bindings (browser)
openvdb = ["dep:vdb-rs"]  # OpenVDB float grid I/O (.vdb)
all-shaders = ["gpu", "hlsl", "glsl", "blinkscript"]  # All shader transpilers
unity = ["ffi", "glsl"]  # Unity integration (FFI + GLSL)
unreal = ["ffi", "hlsl"]  # Unreal Engine integration (FFI + HLSL)
aaa = ["volume", "gpu-mesh", "svo-gpu", "destruction", "terrain", "gi"]  # All AAA game features

[dependencies]
# SIMD math
glam = { version = "0.29", features = ["serde"] }
wide = "0.7"  # Portable SIMD (AVX2/AVX-512/NEON)

# Parallel processing
rayon = "1.10"

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
# bincode 2.x: `serde` feature で既存 serde derive 活用、`config::legacy()` で
# bincode 1 wire format 互換維持 (既存 .asdf file 読み込み可能)
# RUSTSEC-2025-0141 (bincode 1 unmaintained) 解消のため 2 系へ移行
bincode = { version = "2.0", features = ["serde"] }

# Error handling
thiserror = "2.0"

# Logging
log = "0.4"

# CLI (optional)
clap = { version = "4.5", features = ["derive"], optional = true }

# Python bindings (optional)
# `abi3-py310` で Python 3.10+ の安定 ABI に固定。1 つの `.so` で 3.10/3.11/3.12/3.13 を
# サポートし、Python ABI ごとの再ビルドが不要になる (setup の煩雑さを解消)。
# pyo3 0.29+: RUSTSEC-2025-0020 / RUSTSEC-2026-0177 解消のため 0.23 → 0.29 へ major bump
# `Bound<'_, T>` API が default 化、`#[pyfunction]` / `#[pymethods]` は多くが互換
pyo3 = { version = "0.29", features = ["extension-module", "multiple-pymethods", "abi3-py310"], optional = true }
numpy = { version = "0.29", optional = true }

# Godot GDExtension (optional)
godot = { version = "0.2", optional = true }

# CRC for file integrity
crc32fast = "1.4"

# Bridge deps (optional, crates.io since 1.12.0; alice-font pending publish)
alice-physics = { version = "1.1", optional = true }
alice-codec = { version = "0.1.2", optional = true }
libasp = { version = "1.0", optional = true }
alice-cache = { version = "0.2", optional = true }

# FFI support (optional)
lazy_static = { version = "1.5", optional = true }

# JIT compilation (optional)
cranelift-codegen = { version = "0.113", optional = true }
cranelift-frontend = { version = "0.113", optional = true }
cranelift-jit = { version = "0.113", optional = true }
cranelift-module = { version = "0.113", optional = true }
cranelift-native = { version = "0.113", optional = true }

# GPU compute (optional)
wgpu = { version = "24", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1.21", features = ["derive"], optional = true }
futures-channel = { version = "0.3", optional = true }

# Image loading (optional, for texture-fit)
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }

# WebAssembly bindings (optional)
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }

# OpenVDB I/O (optional)
vdb-rs = { version = "0.6", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
naga = { version = "24", default-features = false, features = ["wgsl-in", "glsl-in"] }

[[bench]]
name = "sdf_eval"
harness = false

[[bench]]
name = "frame_cost"
harness = false

[[bench]]
name = "gpu_vs_cpu"
harness = false
required-features = []

[[bench]]
name = "npr_primitives"
harness = false

# The `text_to_3d_demo` example imports `alice_font::glyph_dispatcher` and
# `alice_sdf::font_bridge`; both live behind the `font` feature (which pulls
# in the `alice-font` path dep — currently disabled for the 1.7.7 crates.io
# publish per the note above). Gating the example here keeps
# `cargo check --all-targets` (default features) green.
[[example]]
name = "text_to_3d_demo"
required-features = ["font"]

# Declare the 5 bridge features as known even though the entries are
# gone from [features] for the 1.7.7 crates.io publish. Without this
# `cargo clippy -- -D warnings` and `cargo doc -Dwarnings` fail on
# `#[cfg(feature = "physics")]` etc. left in src/lib.rs — the code is
# retained on purpose for the 1.8.0 restoration.
# docs.rs: default (`cli`) だけだと transpiler / JIT / SVO / terrain 等の
# API が一切 doc に出ない。gpu (wgpu) は build が重いので除外。
[package.metadata.docs.rs]
features = ["glsl", "hlsl", "jit", "svo", "terrain", "destruction", "gi", "ffi"]
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("codec", "physics", "asp", "sdf-cache", "font"))',
    'cfg(alice_font_bridge)',
    'cfg(docsrs)',
] }

# Crate-wide clippy policy (1.12.0): pedantic + nursery are the bar for the
# whole crate, CI runs clippy with -D warnings, so every entry below is a
# deliberate, documented exception — not a per-site silencer.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Doc-shape lints: the API surface is documented per module; requiring an
# "# Errors" / "# Panics" section and #[must_use] on ~2000 functions adds
# noise without changing behaviour. Panicking APIs do document it.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
# nursery style lints that trade readability for nothing in this code base:
# `if let Some(x) = .. { x } else { push; .. }` with side effects in the else
# branch, and `for v in [a, b]` over a destructured tuple.
option_if_let_else = "allow"
tuple_array_conversions = "allow"
# `pow(x, 1/3)` is kept where a shader helper mirrors the CPU law (WGSL /
# GLSL / HLSL have no cbrt); `cbrt()` would open a parity gap.
imprecise_flops = "allow"
# Naming: math / SDF code uses px, py, pz, ra, rb …
similar_names = "allow"
many_single_char_names = "allow"
module_name_repetitions = "allow"
# Casts: SDF code converts freely between f32 / u32 / usize / i32 (grid
# indices, resolutions, counts); the values are small by construction.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_possible_wrap = "allow"
return_self_not_must_use = "allow"
# Style accepted in a math-heavy code base
uninlined_format_args = "allow"
match_same_arms = "allow"
wildcard_imports = "allow"
items_after_statements = "allow"
format_push_string = "allow"
explicit_iter_loop = "allow"
needless_pass_by_value = "allow"
redundant_closure_for_method_calls = "allow"
bool_to_int_with_if = "allow"
if_not_else = "allow"
needless_bool = "allow"
let_unit_value = "allow"
# inline(always) is intentional on SIMD / evaluator hot paths
inline_always = "allow"
# Large match-based evaluators are inherent to an SDF VM
too_many_lines = "allow"
struct_excessive_bools = "allow"
# Exact float comparison is intentional in SDF math and its tests
float_cmp = "allow"
case_sensitive_file_extension_comparisons = "allow"
# Pointer casts in FFI / SIMD code
ptr_as_ptr = "allow"
# Misc
map_unwrap_or = "allow"
used_underscore_binding = "allow"
single_match_else = "allow"
unnecessary_wraps = "allow"
match_wildcard_for_single_variants = "allow"
cloned_instead_of_copied = "allow"
let_underscore_untyped = "allow"
pub_underscore_fields = "allow"
no_effect_underscore_binding = "allow"
cast_ptr_alignment = "allow"
manual_let_else = "allow"
unreadable_literal = "allow"

# cargo-machete false-positive suppression
# 以下は現状 direct use は無いが将来使用予定 or feature-gated planned dep として保持
# - log: 現状 shader 生成文字列内のみ、将来 log::info!/warn! 導入予定
# - js-sys: wasm bindings 追加時に使用予定
# - vdb-rs: openvdb feature 有効時の bake pipeline 実装予定
# cargo-semver-checks lint overrides: none. A planned one-time break is
# handled by downgrading *only* its lint here (`<lint> = "warn"`) with a
# CHANGELOG entry, and removing the entry right after the publish
# (1.12.0: DeserializeError::Stack / #[non_exhaustive]).
[package.metadata.cargo-semver-checks.lints]

[package.metadata.cargo-machete]
ignored = ["log", "js-sys", "vdb-rs"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# For native CPU optimizations: RUSTFLAGS="-C target-cpu=native" cargo build --release

[profile.bench]
opt-level = 3
lto = "thin"
debug = false
codegen-units = 1

