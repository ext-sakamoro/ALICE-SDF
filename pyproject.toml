[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "alice-sdf"
version = "0.1.0"
description = "ALICE-SDF: 3D/Spatial Data Specialist - Store laws, not polygons"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Moroya Sakamoto" }]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
keywords = ["sdf", "signed-distance-function", "3d", "procedural", "csg"]

[project.urls]
Repository = "https://github.com/ext-sakamoro/ALICE-SDF"

[tool.maturin]
# Python wheel default feature set: enable all three CPU shader transpilers
# (GLSL / HLSL / BlinkScript) so that `SdfNode.to_glsl()` / `.to_hlsl()` /
# `.to_blinkscript()` all work out of the box against the crates.io / PyPI
# wheel. `gpu` (for `.to_wgsl()`) / `volume` (for `bake_to_vdb`) remain
# opt-in because they pull in wgpu (~15 MB) and platform-specific runtime
# deps.
features = ["python", "hlsl", "glsl", "blinkscript"]
module-name = "alice_sdf"
python-source = "python"
