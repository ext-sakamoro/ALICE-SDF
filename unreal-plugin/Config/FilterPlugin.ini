[FilterPlugin]
; Files packaged with the plugin in addition to UAT's defaults (uplugin,
; build products, /Binaries/ThirdParty, /Resources, /Content, /Shaders,
; /Source). Paths are relative to the plugin root.
;
; The native library and its header live in /ThirdParty/AliceSDF/, which
; BuildPluginCommand's filter drops — a packaged plugin then had no
; alice_sdf.dll and failed to load its module (GetLastError=126). The CI
; gate for this is scripts/unreal-ue5-ci.ps1 (packaged DLL exists and is
; the one just built).
/ThirdParty/AliceSDF/lib/...
/ThirdParty/AliceSDF/include/...
/README.md
; Content/ is copied by UAT, but Python scripts under it are only kept when
; named explicitly.
/Content/Python/...
