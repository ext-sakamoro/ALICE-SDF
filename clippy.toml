# Determinism gate. The CPU evaluators promise the same distance bits for the
# same tree and point on every platform CI tests, and the bounds, meshes,
# heightmaps and fits built from them inherit that promise only if their own
# arithmetic is reproducible too.
#
# IEEE 754 does not require the transcendentals to be correctly rounded, so the
# platform libm is free to differ between OS, CPU and compiler. Everything
# transcendental therefore goes through `alice-det-math`, whose kernels are
# built from IEEE 754 basic operations only and compute the same bits on every
# target. `powi` is listed because it lowers to a multiplication tree whose
# association order is unspecified. `sin_cos` is two libm calls.
#
# `mul_add` is different: it is a fused multiply-add with a single rounding,
# specified exactly by IEEE 754 (a target without an FMA instruction gets the
# correctly rounded software `fma`), so it returns the same bits everywhere. It
# is listed because the same law is also evaluated by the JIT and emitted as
# shader and Rust source, which compute `a * b + c` with two roundings; a fused
# operation in one path and not in the other gives different bits for the same
# formula. `scripts/det_math_guard.py` additionally keeps it out of the law
# directories by text, which also covers the generic `Real` code clippy cannot
# resolve.
#
# Deliberately absent: `sqrt`, `floor`, `round`, `trunc`, `ceil` (exact in IEEE
# 754, bit-identical on every target).
#
# Exceptions carry a scoped `#[allow(clippy::disallowed_methods, reason = ..)]`:
# rendering helpers whose output is a colour or a light value and never feeds a
# distance, bound or mesh, and tests that use the platform libm as an
# independent reference (an oracle whose expected value comes from the
# implementation under test proves nothing).
#
# CI runs clippy with `--all-targets ... -D warnings`, which turns
# `disallowed_methods` into a red gate for the library, the tests, the examples
# and the benches alike. Pinned by tests/test_det_golden.rs on every OS lane.
disallowed-methods = [
    { path = "f32::sin", reason = "platform libm is not cross-platform bit-exact; use alice_det_math" },
    { path = "f32::cos", reason = "platform libm is not cross-platform bit-exact; use alice_det_math" },
    { path = "f32::tan", reason = "platform libm is not cross-platform bit-exact; use alice_det_math" },
